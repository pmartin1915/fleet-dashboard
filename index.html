      + (a.reverted || 0) + ' reverted' + revertSplit + ' / ' + (a.error || 0) + ' err'
      + ' · repos: ' + comp.buildRepos.join(', ');
    cb.appendChild(badge);
    cb.appendChild(detail);
    container.appendChild(cb);
  }

  if (projMap.size > 0) {
    const projWrap = document.createElement('div');
    projWrap.className = 'cr-projects';
    const projects = Array.from(projMap.values()).sort(
      (a, b) => (RANK[b.health] || 0) - (RANK[a.health] || 0) || a.slug.localeCompare(b.slug)
    );
    for (const p of projects) {
      const chip = document.createElement('div');
      chip.className = 'cr-chip';
      const dot = document.createElement('span');
      dot.className = 'cr-chip-dot ' + (p.health || 'idle');
      const slug = document.createElement('span');
      slug.textContent = p.slug;
      const st = document.createElement('span');
      st.className = 'cr-chip-state';
      st.textContent = p.health || 'idle';
      chip.appendChild(dot);
      chip.appendChild(slug);
      if (p.relayStage) {
        const stage = document.createElement('span');
        stage.className = 'cr-chip-stage';
        stage.textContent = p.relayStage.toUpperCase() +
          (p.relayNext ? ' → ' + p.relayNext.toUpperCase() : '');
        chip.appendChild(stage);
      }
      chip.appendChild(st);
      projWrap.appendChild(chip);
    }
    container.appendChild(projWrap);
  }

  renderCRReverts(withCR, container);
  renderCRQuality(withCR, container);
  renderCRMergeStats(withCR, container);

  const feedWrap = document.createElement('div');
  feedWrap.className = 'cr-feed';
  const GOOD = ['success', 'no-changes', 'auto-recovered', 'auto-push-success', 'health-check-pass'];
  const BAD = ['error', 'local-env-broken', 'canary-failed', 'scan-revert', 'clinical-gate-revert', 'health-check-fail', 'auto-push-failed'];
  const makeAnnunciatorRow = (g) => {
    const f = g.first;
    const row = document.createElement('div');
    let cls = 'warn';
    if (GOOD.includes(f.outcome)) cls = 'ok';
    else if (BAD.includes(f.outcome)) cls = 'bad';
    row.className = 'cr-feed-row ' + cls;
    const t = document.createElement('span');
    t.className = 'cr-feed-time';
    const ms = Date.parse(f.ts);
    t.textContent = isFinite(ms) ? formatDuration(Date.now() - ms) : '';
    const m = document.createElement('span');
    m.className = 'cr-feed-machine';
    m.textContent = f.machine || '';
    const line = document.createElement('span');
    line.className = 'cr-feed-line';
    line.textContent = f.line || '';
    if (g.count > 1) {
      const countBadge = document.createElement('span');
      countBadge.className = 'cr-feed-count';
      countBadge.textContent = ' x' + g.count;
      line.appendChild(countBadge);
    }
    row.appendChild(t);
    row.appendChild(m);
    row.appendChild(line);
    return row;
  };
  if (feed.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'ad-detail';
    empty.textContent = 'No recent activity.';
    feedWrap.appendChild(empty);
  } else {
    buildGroupedFeed(feedWrap, feed, makeAnnunciatorRow);
  }
  container.appendChild(feedWrap);

  // --- Construction Timeline + flagship spotlight (from the gist-embedded
  // git-log digest each machine carries; merged + deduped by sha). ---
  renderConstructionTimeline(container, withCR);
}

// Build one timeline-event row mirroring the local dashboard's crTimelineRow.
function crBuildTimelineRow(e, showSlug) {
  const row = document.createElement('div');
  row.className = 'cr-feed-row ' + (e.kind === 'auto' ? 'ok' : '');
  const t = document.createElement('span');
  t.className = 'cr-feed-time';
  const ms = Date.parse(e.ts);
  t.textContent = isFinite(ms) ? formatDuration(Date.now() - ms) : '';
  if (isFinite(ms)) t.title = new Date(ms).toLocaleString();
  row.appendChild(t);
  const line = document.createElement('span');
  line.className = 'cr-feed-line';
  if (showSlug) {
    const sl = document.createElement('span');
    sl.className = 'cr-timeline-slug';
    sl.textContent = e.slug;
    line.appendChild(sl);
  }
  if (e.task) {
    const tag = document.createElement('span');
    const slug = String(e.task).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    tag.className = 'cr-timeline-task' + (slug ? ' task-' + slug : '');
    tag.textContent = String(e.task).toLowerCase();
    line.appendChild(tag);
  } else if (e.kind === 'auto') {
    const tag = document.createElement('span');
    tag.className = 'cr-timeline-task';
    tag.textContent = 'auto';
    line.appendChild(tag);
  }
  const txt = e.subject || '(no subject)';
  if (e.url) {
    const a = document.createElement('a');
    a.className = 'cr-timeline-link';
    a.href = e.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = txt;
    line.appendChild(a);
  } else {
    line.appendChild(document.createTextNode(txt));
  }
  if (e.prNumber) {
    const pr = document.createElement('span');
    pr.className = 'cr-timeline-sha';
    pr.textContent = '#' + e.prNumber;
    line.appendChild(pr);
  }
  if (e.additions != null || e.deletions != null) {
    const diff = document.createElement('span');
    diff.className = 'cr-timeline-diff';
    const a = e.additions != null ? e.additions : 0;
    const d = e.deletions != null ? e.deletions : 0;
    diff.textContent = '+' + a + ' -' + d;
    line.appendChild(diff);
  }
  row.appendChild(line);
  return row;
}

function renderConstructionTimeline(container, withCR) {
  crTimelineData = { container, withCR };
  // Replace any previous timeline section so filter re-renders are idempotent.
  const existing = container.querySelector('.cr-timeline-section');
  if (existing) existing.remove();

  // Merge events across machines, dedup by sha, newest first.
  const seen = new Set();
  const events = [];
  let panels = null;
  for (const s of withCR) {
    const tl = s.control_room && s.control_room.timeline;
    if (!tl) continue;
    for (const e of (tl.events || [])) {
      const key = e.sha || (e.slug + '|' + e.ts + '|' + e.subject);
      if (seen.has(key)) continue;
      seen.add(key);
      events.push(e);
    }
    if (!panels && tl.spotlights && tl.spotlights.length) panels = tl.spotlights;
    else if (!panels && tl.spotlight && (tl.spotlight.events || []).length) panels = [tl.spotlight];
  }
  const hasPanels = panels && panels.length;
  if (events.length === 0 && !hasPanels) return;
  events.sort((a, b) => (Date.parse(b.ts) || 0) - (Date.parse(a.ts) || 0));

  const section = document.createElement('div');
  section.className = 'cr-timeline-section';

  if (hasPanels) {
    const head = document.createElement('div');
    head.className = 'cr-subhead';
    head.textContent = 'Watch it build';
    section.appendChild(head);
    for (const s of panels) {
      if (!(s.events || []).length) continue;
      const box = document.createElement('div');
      box.className = 'cr-spotlight';
      const title = document.createElement('div');
      title.className = 'cr-spotlight-title';
      title.textContent = s.slug;
      const cnt = document.createElement('span');
      cnt.className = 'cr-spotlight-count';
      cnt.textContent = (s.auto || 0) + ' auto / ' + (s.total || 0) + ' commits';
      title.appendChild(cnt);
      box.appendChild(title);
      if (s.thumbnailUrl) {
        const img = document.createElement('img');
        img.className = 'cr-thumb';
        img.loading = 'lazy';
        img.alt = s.slug + ' latest build screenshot';
        img.onerror = function () { img.remove(); };
        img.src = s.thumbnailUrl;
        box.appendChild(img);
      }
      if (s.roadmap && s.roadmap.total) {
        const rm = document.createElement('div');
        rm.className = 'cr-roadmap';
        const lbl = document.createElement('div');
        lbl.className = 'cr-roadmap-label';
        lbl.textContent = 'ROADMAP ' + (s.roadmap.done || 0) + ' / ' + s.roadmap.total + ' systems built';
        // Exhausted roadmap = feature dispatch gated off until the operator
        // extends it (2026-07-15). Same computation as the fill width below.
        if ((s.roadmap.done || 0) >= s.roadmap.total) {
          lbl.textContent = 'ROADMAP COMPLETE (' + s.roadmap.total + '/' + s.roadmap.total + ') - extend me';
        }
        rm.appendChild(lbl);
        const bar = document.createElement('div');
        bar.className = 'cr-roadmap-bar';
        const fill = document.createElement('div');
        fill.className = 'cr-roadmap-fill';
        var pct = Math.round(((s.roadmap.done || 0) / s.roadmap.total) * 100);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        fill.style.width = pct + '%';
        bar.appendChild(fill);
        rm.appendChild(bar);
        box.appendChild(rm);
      }
      const feed = document.createElement('div');
      feed.className = 'cr-feed';
      if (s.auto === 0) {
        const armed = document.createElement('div');
        armed.className = 'cr-feed-row';
        const armedLine = document.createElement('span');
        armedLine.className = 'cr-feed-line';
        armedLine.style.opacity = '0.7';
        armedLine.textContent = 'armed - no autonomous builds merged yet (' + s.total + ' human commits)';
        armed.appendChild(armedLine);
        feed.appendChild(armed);
      }
      for (const e of (s.events || [])) feed.appendChild(crBuildTimelineRow(e, false));
      box.appendChild(feed);
      section.appendChild(box);
    }
  }

  const head2 = document.createElement('div');
  head2.className = 'cr-subhead';
  head2.textContent = 'Construction timeline';
  section.appendChild(head2);

  const filterBar = document.createElement('div');
  filterBar.className = 'cr-filter';
  const filters = ['all', 'auto', 'human'];
  for (const f of filters) {
    const btn = document.createElement('button');
    btn.textContent = f;
    btn.className = crTimelineFilter === f ? 'active' : '';
    btn.addEventListener('click', () => { crTimelineFilter = f; renderConstructionTimeline(crTimelineData.container, crTimelineData.withCR); });
    filterBar.appendChild(btn);
  }
  section.appendChild(filterBar);

  const tlWrap = document.createElement('div');
  tlWrap.className = 'cr-feed';
  const applyFilter = () => {
    tlWrap.textContent = '';
    const filtered = crTimelineFilter === 'all' ? events : events.filter((e) => e.kind === crTimelineFilter);
    for (const e of filtered.slice(0, 40)) tlWrap.appendChild(crBuildTimelineRow(e, true));
    if (!filtered.length) tlWrap.textContent = 'No builds recorded yet.';
  };
  section.appendChild(tlWrap);
  applyFilter();

  container.appendChild(section);
}

function renderStuckPatterns(gist) {
  const container = document.getElementById('stuckPatternsPanel');
  container.innerHTML = '';

  const files = Object.keys(gist.files || {}).filter(
    (f) => /^auto-digest-[a-z0-9-]+\.json$/.test(f)
  );
  const snaps = [];
  for (const f of files) {
    const data = parseFile(gist, f);
    if (!data || typeof data !== 'object') continue;
    if (!Array.isArray(data.stuck_patterns)) continue;
    snaps.push(data);
  }
  // Hide the panel unless at least one machine reports stuck patterns.
  // Empty stuck_patterns arrays count as "no signal worth surfacing."
  const hasSignal = snaps.some((s) => (s.stuck_patterns || []).length > 0);
  if (!hasSignal) {
    container.style.display = 'none';
    return;
  }

  // Aggregate per-machine + per-project. Mirrors aggregateFleetStuckPatterns.
  const byMachine = [];
  const projectMap = new Map();
  let totalPatterns = 0;
  const projectSet = new Set();
  let machinesWithPatterns = 0;

  for (const snap of snaps) {
    const patterns = snap.stuck_patterns || [];
    byMachine.push({
      machine: snap.machine,
      computed_at: snap.computed_at,
      patterns,
    });
    if (patterns.length > 0) machinesWithPatterns += 1;
    for (const p of patterns) {
      if (!p || typeof p !== 'object' || !p.project) continue;
      totalPatterns += 1;
      projectSet.add(p.project);
      const existing = projectMap.get(p.project) || {
        slug: p.project, count: 0, machines: [],
      };
      existing.count += 1;
      existing.machines.push({ machine: snap.machine, count: Number(p.count) || 0 });
      projectMap.set(p.project, existing);
    }
  }
  byMachine.sort((a, b) => String(a.machine).localeCompare(String(b.machine)));
  const byProject = Array.from(projectMap.values()).sort(
    (a, b) => b.count - a.count || a.slug.localeCompare(b.slug)
  );

  const details = document.createElement('details');
  details.className = 'panel-details';

  const summary = document.createElement('summary');
  summary.className = 'panel-summary ad-header';
  summary.textContent =
    `Stuck skip patterns - ${totalPatterns} on ${machinesWithPatterns} ` +
    `${machinesWithPatterns === 1 ? 'machine' : 'machines'} ` +
    `(${projectSet.size} project${projectSet.size === 1 ? '' : 's'})`;
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'panel-body';

  // Per-machine rows: list each pattern as "[project:task] reason ×N".
  const machineSection = document.createElement('div');
  machineSection.className = 'ad-section';
  machineSection.textContent = 'By machine';
  body.appendChild(machineSection);

  for (const m of byMachine) {
    if (!m.patterns || m.patterns.length === 0) continue;
    const row = document.createElement('div');
    row.className = 'ad-row';
    const left = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'ad-name';
    name.textContent = m.machine;
    left.appendChild(name);

    const top3 = m.patterns
      .slice()
      .sort((a, b) => (Number(b.count) || 0) - (Number(a.count) || 0))
      .slice(0, 3)
      .map((p) => `${p.project}:${p.task} ×${p.count}`)
      .join(', ');
    if (top3) {
      const detail = document.createElement('span');
      detail.className = 'ad-detail';
      detail.textContent = '  ' + top3;
      left.appendChild(detail);
    }

    const right = document.createElement('span');
    const count = document.createElement('span');
    count.className = 'ad-count';
    count.textContent = `${m.patterns.length} stuck`;
    right.appendChild(count);

    row.appendChild(left);
    row.appendChild(right);
    body.appendChild(row);
  }

  // Per-project rollup.
  if (byProject.length > 0) {
    const projSection = document.createElement('div');
    projSection.className = 'ad-section';
    projSection.textContent = 'By project';
    body.appendChild(projSection);

    for (const p of byProject) {
      const row = document.createElement('div');
      row.className = 'ad-row';
      const left = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'ad-name';
      name.textContent = p.slug;
      left.appendChild(name);

      const detail = document.createElement('span');
      detail.className = 'ad-detail';
      detail.textContent = '  ' + p.machines
        .map((mm) => `${mm.machine}:${mm.count}`)
        .join(', ');
      left.appendChild(detail);

      const right = document.createElement('span');
      const count = document.createElement('span');
      count.className = 'ad-count';
      count.textContent = `${p.count} machine${p.count === 1 ? '' : 's'}`;
      right.appendChild(count);

      row.appendChild(left);
      row.appendChild(right);
      body.appendChild(row);
    }
  }

  details.appendChild(body);
  container.appendChild(details);
  container.style.display = '';
}

// === Test-counts panel ===
// Reads test-counts-<host>.json snapshots written by the daily
// BudgetDispatcher-TestCounts task (scripts/run-test-counts.ps1 ->
// scripts/test-counts.mjs). Mirrors computeDivergence in
// scripts/lib/test-counts.mjs (kept in sync by hand since the dashboard
// has no bundler). When the fleet agrees on a single (pass/fail/skip)
// tuple at a given HEAD, the panel shows that tuple in a calm line.
// When machines disagree, divergent rows are highlighted so the operator
// can see exactly which host has drifted without waiting for the ntfy.
// Hidden until at least one machine has uploaded a snapshot.
function renderTestCounts(gist) {
  const container = document.getElementById('testCountsPanel');
  container.innerHTML = '';

  const files = Object.keys(gist.files || {}).filter(
    (f) => /^test-counts-[a-z0-9-]+\.json$/.test(f)
  );
  if (files.length === 0) {
    container.style.display = 'none';
    return;
  }

  const snaps = [];
  for (const f of files) {
    const data = parseFile(gist, f);
    if (!data || typeof data !== 'object') continue;
    if (typeof data.machine !== 'string') continue;
    if (typeof data.head_sha !== 'string') continue;
    if (typeof data.ts !== 'string') continue;
    snaps.push(data);
  }
  if (snaps.length === 0) {
    container.style.display = 'none';
    return;
  }

  // Partition snapshots: fresh vs excluded (stale / run-error).
  const STALE_HOURS = 48;
  const now = Date.now();
  const staleCutoff = now - STALE_HOURS * 3_600_000;

  const fresh = [];
  const excluded = [];
  for (const s of snaps) {
    const tsMs = Date.parse(s.ts);
    if (Number.isNaN(tsMs)) {
      excluded.push({ machine: s.machine, reason: 'unparseable-ts' });
      continue;
    }
    if (tsMs < staleCutoff) {
      excluded.push({ machine: s.machine, reason: 'stale', head_sha: s.head_sha, ts: s.ts });
      continue;
    }
    if (s.error) {
      excluded.push({ machine: s.machine, reason: 'run-error', head_sha: s.head_sha, ts: s.ts });
      continue;
    }
    fresh.push(s);
  }

  // Pick the SHA to lock on: majority among fresh; ties broken by most
  // recent ts. Mirrors computeDivergence's selection.
  let pickSha = null;
  let onSha = [];
  let differentSha = [];
  if (fresh.length > 0) {
    const shaCounts = new Map();
    const shaLatestTs = new Map();
    for (const s of fresh) {
      shaCounts.set(s.head_sha, (shaCounts.get(s.head_sha) || 0) + 1);
      const tsMs = Date.parse(s.ts);
      if (!shaLatestTs.has(s.head_sha) || tsMs > shaLatestTs.get(s.head_sha)) {
        shaLatestTs.set(s.head_sha, tsMs);
      }
    }
    let pickCount = -1;
    let pickTs = -1;
    for (const [sha, count] of shaCounts) {
      const ts = shaLatestTs.get(sha) || 0;
      if (count > pickCount || (count === pickCount && ts > pickTs)) {
        pickSha = sha;
        pickCount = count;
        pickTs = ts;
      }
    }
    for (const s of fresh) {
      if (s.head_sha === pickSha) onSha.push(s);
      else differentSha.push({ machine: s.machine, head_sha: s.head_sha, ts: s.ts });
    }
  }

  // Group on-sha machines by their (pass/fail/skip) tuple. Tiebreak the
  // reference tuple on (count, pass, -fail, -skip, alphabetic) so a 1:1
  // split between 1094/0/0 and 1092/2/0 names the clean tuple as the
  // reference (matches computeDivergence's parseTuple/refScore logic).
  const tupleOf = (s) => `${Number(s.pass) || 0}/${Number(s.fail) || 0}/${Number(s.skip) || 0}`;
  const byTuple = new Map();
  for (const s of onSha) {
    const t = tupleOf(s);
    if (!byTuple.has(t)) byTuple.set(t, []);
    byTuple.get(t).push(s);
  }
  const tupleSet = Array.from(byTuple.keys()).sort();

  let referenceTuple = null;
  let refScore = null;
  for (const t of tupleSet) {
    const machineCount = byTuple.get(t).length;
    const parts = t.split('/').map((x) => Number(x) || 0);
    const score = [machineCount, parts[0], -parts[1], -parts[2]];
    if (
      referenceTuple === null ||
      score[0] > refScore[0] ||
      (score[0] === refScore[0] && score[1] > refScore[1]) ||
      (score[0] === refScore[0] && score[1] === refScore[1] && score[2] > refScore[2]) ||
      (score[0] === refScore[0] && score[1] === refScore[1] && score[2] === refScore[2] && score[3] > refScore[3]) ||
      (score[0] === refScore[0] && score[1] === refScore[1] && score[2] === refScore[2] && score[3] === refScore[3] && t < referenceTuple)
    ) {
      referenceTuple = t;
      refScore = score;
    }
  }

  const diverged = tupleSet.length > 1;

  // When exclusions are present, the summary includes both the on-SHA
  // machine count and the total snapshot count so a 2/5-reporting fleet
  // doesn't visually masquerade as a 2/2-converged one. The "reporting"
  // phrasing side-steps subject-verb agreement (e.g., the awkward "1
  // machine agree") since the noun is now uncountable in the singular.
  const totalSnapshots = snaps.length;
  const compareLabel = totalSnapshots === onSha.length
    ? `${onSha.length} machine${onSha.length === 1 ? '' : 's'} reporting`
    : `${onSha.length} of ${totalSnapshots} machines reporting`;
  let headerText;
  if (diverged) {
    headerText =
      `TEST COUNTS — DIVERGED on ${(pickSha || '').slice(0, 7)} ` +
      `(${tupleSet.length} tuples across ${compareLabel})`;
  } else if (referenceTuple) {
    headerText =
      `TEST COUNTS — ${referenceTuple} on ${(pickSha || '').slice(0, 7)} ` +
      `(${compareLabel})`;
  } else {
    headerText = 'TEST COUNTS — no fresh snapshots';
  }

  const details = document.createElement('details');
  details.className = 'panel-details';

  const summary = document.createElement('summary');
  summary.className = 'panel-summary ad-header';
  summary.textContent = headerText;
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'panel-body';

  // ----- On-SHA machine rows -----
  if (onSha.length > 0) {
    const section = document.createElement('div');
    section.className = 'ad-section';
    section.textContent = 'By machine';
    body.appendChild(section);

    const sorted = onSha.slice().sort((a, b) =>
      String(a.machine).localeCompare(String(b.machine))
    );
    for (const s of sorted) {
      const tuple = tupleOf(s);
      const isDivergent = tuple !== referenceTuple;

      const row = document.createElement('div');
      row.className = 'ad-row';

      const left = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'ad-name';
      name.textContent = s.machine;
      left.appendChild(name);

      const detail = document.createElement('span');
      detail.className = 'ad-detail';
      const ageMs = now - Date.parse(s.ts);
      const ageH = ageMs / 3_600_000;
      const ageLabel = ageH < 1
        ? `${Math.round(ageMs / 60_000)}m ago`
        : ageH < 24
          ? `${Math.round(ageH)}h ago`
          : `${Math.round(ageH / 24)}d ago`;
      const totalLabel = `total=${Number(s.total) || 0}`;
      detail.textContent = `  ${totalLabel}  ${ageLabel}`;
      left.appendChild(detail);

      const right = document.createElement('span');
      const count = document.createElement('span');
      // Reuse .ad-count's accent color for the canonical tuple; mute
      // it for divergent rows so the eye lands on the count value, not
      // on a color that says "this is fine."
      count.className = isDivergent ? 'ad-count zero' : 'ad-count';
      count.textContent = isDivergent ? `${tuple}  <- divergent` : tuple;
      right.appendChild(count);

      row.appendChild(left);
      row.appendChild(right);
      body.appendChild(row);
    }
  }

  // ----- Excluded rollup -----
  const allExcluded = excluded.concat(
    differentSha.map((d) => ({
      machine: d.machine,
      reason: 'different-sha',
      head_sha: d.head_sha,
      ts: d.ts,
    }))
  );
  if (allExcluded.length > 0) {
    const section = document.createElement('div');
    section.className = 'ad-section';
    section.textContent = 'Not in comparison';
    body.appendChild(section);

    allExcluded.sort((a, b) =>
      String(a.machine).localeCompare(String(b.machine))
    );
    for (const e of allExcluded) {
      const row = document.createElement('div');
      row.className = 'ad-row';

      const left = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'ad-name';
      name.textContent = e.machine;
      left.appendChild(name);

      const detail = document.createElement('span');
      detail.className = 'ad-detail';
      const shaPart = e.head_sha ? `sha=${e.head_sha.slice(0, 7)}` : '';
      detail.textContent = '  ' + [e.reason, shaPart].filter(Boolean).join(' ');
      left.appendChild(detail);

      row.appendChild(left);
      body.appendChild(row);
    }
  }

  details.appendChild(body);
  container.appendChild(details);
  container.style.display = '';
}

// === Pending-merges panel ===

function renderPendingMerges(gist) {
  const container = document.getElementById('pendingMerges');
  container.innerHTML = '';
  const data = parseFile(gist, 'pending-merges.json');
  const entries = Array.isArray(data?.entries) ? data.entries : [];
  if (entries.length === 0) return;

  const inflight = entries.filter(e => e && !e.completed && e.next_deadline_ms != null);
  const clean = entries.filter(e => e && e.completed && e.outcome === 'replays-clean');
  const suspended = entries.filter(e => e && e.completed && e.outcome === 'auto-suspended');

  if (inflight.length === 0 && clean.length === 0 && suspended.length === 0) return;

  inflight.sort((a, b) => (a.next_deadline_ms || 0) - (b.next_deadline_ms || 0));

  const details = document.createElement('details');
  details.className = 'pm-details';
  details.open = true;

  const summary = document.createElement('summary');
  summary.className = 'pm-summary';
  summary.textContent = `Pending merges - ${inflight.length} in flight, ${suspended.length} suspended`;
  details.appendChild(summary);

  const wrap = document.createElement('div');
  wrap.className = 'pm-table-wrap';

  const table = document.createElement('table');
  table.className = 'pm-table';
  const thead = document.createElement('thead');
  const headTr = document.createElement('tr');
  for (const h of ['Project', 'PR', 'Replays', 'Next replay', 'Last replay', 'State']) {
    const th = document.createElement('th');
    th.textContent = h;
    headTr.appendChild(th);
  }
  thead.appendChild(headTr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (const e of inflight) tbody.appendChild(buildPmEntry(e, 'inflight'));
  for (const e of suspended) tbody.appendChild(buildPmEntry(e, 'suspended'));
  // Completed-clean watches are history, not workload: show only the most
  // recent few so the table stays scannable.
  const CLEAN_SHOWN = 5;
  clean.sort((a, b) => (b.last_replay_ts_ms || 0) - (a.last_replay_ts_ms || 0));
  for (const e of clean.slice(0, CLEAN_SHOWN)) tbody.appendChild(buildPmEntry(e, 'clean'));
  table.appendChild(tbody);
  wrap.appendChild(table);
  details.appendChild(wrap);
  if (clean.length > CLEAN_SHOWN) {
    const more = document.createElement('div');
    more.className = 'pm-more';
    more.textContent = `...and ${clean.length - CLEAN_SHOWN} more completed clean`;
    details.appendChild(more);
  }
  container.appendChild(details);
}

function buildPmEntry(entry, kind) {
  const repo = safe(entry?.repo, '?');
  const prNum = safe(entry?.pr_number, '?');
  const project = safe(entry?.project_slug, '—');
  const total = Array.isArray(entry.replay_schedule_ms) ? entry.replay_schedule_ms.length : '?';
  const done = present(entry.replays_done) ? entry.replays_done : 0;
  const next = untilMs(entry.next_deadline_ms) || '—';
  const last = present(entry.last_replay_ts_ms) ? agoMs(entry.last_replay_ts_ms) : '—';

  const tr = document.createElement('tr');

  const tdProject = document.createElement('td');
  tdProject.textContent = project;
  tr.appendChild(tdProject);

  const tdPr = document.createElement('td');
  if (typeof repo === 'string' && repo.includes('/') && prNum !== '?') {
    const a = document.createElement('a');
    a.href = `https://github.com/${repo}/pull/${prNum}`;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '#' + prNum;
    tdPr.appendChild(a);
  } else {
    tdPr.textContent = '#' + prNum;
  }
  tr.appendChild(tdPr);

  const tdReplays = document.createElement('td');
  tdReplays.textContent = kind === 'clean' ? `${total}` : `${done} / ${total}`;
  tr.appendChild(tdReplays);

  const tdNext = document.createElement('td');
  tdNext.textContent = kind === 'clean' ? '—' : next;
  tr.appendChild(tdNext);

  const tdLast = document.createElement('td');
  tdLast.textContent = last;
  tr.appendChild(tdLast);

  const tdState = document.createElement('td');
  const chip = document.createElement('span');
  chip.className = `pm-chip ${kind}`;
  chip.textContent = kind;
  tdState.appendChild(chip);
  tr.appendChild(tdState);

  if (kind === 'suspended') {
    const calloutTr = document.createElement('tr');
    calloutTr.className = 'pm-callout-row';
    const td = document.createElement('td');
    td.colSpan = 6;
    td.textContent = 'auto_push:false set in local.json - manual reset required';
    calloutTr.appendChild(td);
    const frag = document.createDocumentFragment();
    frag.appendChild(tr);
    frag.appendChild(calloutTr);
    return frag;
  }

  return tr;
}

// === Top-section render functions (Step 2 redesign) ===
//
// Each returns nothing; each mounts into a fixed container div by id.
// Sections that have no data hide their container (display:none) so they
// drop out of the layout entirely.

// Flatten all auto-digest commits across all machines into a single
// chronologically-sorted list. Used by the rotation panel and "today's
// work" auto-commit count. Returns commits sorted newest-first.
function aggregateAutoDigestCommits(gist) {
  const out = [];
  for (const fname of Object.keys(gist.files || {})) {
    if (!/^auto-digest-[a-z0-9-]+\.json$/.test(fname)) continue;
    const snap = parseFile(gist, fname);
    if (!snap || !Array.isArray(snap.projects)) continue;
    for (const p of snap.projects) {
      if (!Array.isArray(p?.commits)) continue;
      for (const c of p.commits) {
        if (!c?.ts) continue;
        const ms = new Date(c.ts).getTime();
        if (!Number.isFinite(ms)) continue;
        out.push({
          ts: c.ts, ms,
          slug: p.project_slug,
          sha: c.sha,
          subject: c.subject,
          machine: snap.machine,
        });
      }
    }
  }
  out.sort((a, b) => b.ms - a.ms);
  return out;
}

// ---- BEGIN computeBannerVerdict ----
function computeBannerVerdict(fleetSnaps, statuses) {
  const anyBroken = statuses.includes('broken');
  const anyWaiting = statuses.includes('waiting');
  const running = statuses.includes('running');
  const idle = statuses.includes('idle');

  const recentSnaps = fleetSnaps.filter((f) => {
    if (!f.last_run_ts) return false;
    const hrs = (Date.now() - new Date(f.last_run_ts).getTime()) / 3600000;
    return hrs < STALE_HOURS;
  });
  const allDoneForDay = recentSnaps.length > 0 && recentSnaps.every((f) =>
    f.last_run_reason === 'daily-quota-reached' || f.last_run_reason === 'user-active'
  );
  const allNoWork = recentSnaps.length > 0 && recentSnaps.every((f) =>
    f.last_run_reason === 'no-eligible-projects'
  );

  // Compounding facts are aggregated as ORTHOGONAL values, not by picking one
  // "worst" snapshot. COMP_RANK ties 'stalled' and 'compounding-manual' at 3, so
  // a rank-based pick kept whichever appeared FIRST and made the whole verdict
  // depend on array order -- [stalled, manual] and [manual, stalled] returned
  // different banners for the same fleet (Sol review, 2026-07-28).
  const compSnaps = fleetSnaps
    .map((s) => s?.control_room?.compounding)
    .filter((c) => c && Array.isArray(c.buildRepos) && c.buildRepos.length);
  const tracking = compSnaps.length > 0;
  const anyStalled = compSnaps.some((c) => c.status === 'stalled');
  const autonomousMerges = compSnaps.reduce((n, c) => n + (c.autonomousMerges || 0), 0);
  const manualMerges = compSnaps.reduce((n, c) => n + (c.manualMerges || 0), 0);
  const windowDays = compSnaps.find((c) => c.windowDays)?.windowDays ?? 7;

  // "Needs attention", NOT "blocked at auto-push": TROUBLED_OUTCOMES also holds
  // reverted / drift-alert / local-task-failed / health-check-fail, none of which
  // are auto-push blocks. The old copy asserted a cause it had not established.
  const troubledSnaps = fleetSnaps.filter((f) => TROUBLED_OUTCOMES.has(f?.last_run_outcome));
  const troubled = troubledSnaps.length;
  const troubledKinds = [...new Set(troubledSnaps.map((f) => f.last_run_outcome))].sort().join(', ');
  const detail = troubled > 0 ? `${troubled} needing attention: ${troubledKinds}` : null;

  if (anyBroken) {
    const broken = statuses.filter((s) => s === 'broken').length;
    return {
      tier: 'err',
      dotState: 'broken',
      headline: broken === 1
        ? 'Something is wrong on one machine. See attention list below.'
        : `Something is wrong on ${broken} machines. See attention list below.`,
      detail,
    };
  }
  if (anyStalled) {
    return {
      tier: 'warn',
      dotState: 'waiting',
      headline: `Nothing has landed in ${windowDays} days — compounding stalled.`,
      detail,
    };
  }
  if (troubled > 0) {
    return {
      tier: 'warn',
      dotState: 'waiting',
      headline: troubled === 1
        ? '1 machine needs attention.'
        : `${troubled} machines need attention.`,
      detail,
    };
  }
  if (allDoneForDay) {
    return {
      tier: 'warn',
      dotState: 'waiting',
      headline: 'Done for the day. Resets at UTC midnight.',
      detail,
    };
  }
  if (allNoWork) {
    return {
      tier: 'neutral',
      dotState: 'waiting',
      headline: 'Fleet has no work to do. Rotation backlog may be empty.',
      detail,
    };
  }
  if (anyWaiting && !running && !idle) {
    return {
      tier: 'warn',
      dotState: 'waiting',
      headline: 'Fleet is waiting. No machine has run a successful cycle recently.',
      detail,
    };
  }
  // Only AUTONOMOUS merges earn reassurance. control-room.mjs defines
  // 'compounding-manual' as "autonomous loop not closing", so counting manual
  // merges as landing would have said "Everything is fine." about precisely the
  // state that means the system is not working (Sol review, 2026-07-28).
  if (autonomousMerges > 0) {
    return {
      tier: 'ok',
      dotState: 'running',
      headline: 'Everything is fine.',
      detail,
    };
  }
  if (manualMerges > 0) {
    return {
      tier: 'neutral',
      dotState: 'waiting',
      headline: manualMerges === 1
        ? '1 manual merge, no autonomous merges — the loop is not closing.'
        : `${manualMerges} manual merges, no autonomous merges — the loop is not closing.`,
      detail,
    };
  }
  // No build repos means there is no measurement source at all. Claiming
  // "nothing has landed in N days" would assert a fact we never measured, and
  // would persist forever.
  if (!tracking) {
    return {
      tier: 'neutral',
      dotState: 'waiting',
      headline: 'No build repos in rotation — landing status unavailable.',
      detail,
    };
  }
  return {
    tier: 'neutral',
    dotState: 'waiting',
    headline: `Nothing has landed in ${windowDays} days.`,
    detail,
  };
}
// ---- END computeBannerVerdict ----

// Banner v2 — one plain-English sentence that answers "is the dispatcher
// working?". Replaces the legacy uppercase-state-+-reason-code banner.
// Tier mapping per PLAN-dashboard-redesign.md §Banner.
function renderBannerV2(gist, fleetSnaps) {
  const banner = document.getElementById('healthBanner');
  banner.innerHTML = '';

  const statuses = fleetSnaps.map((f) => computeMachineStatus(f));
  const verdict = computeBannerVerdict(fleetSnaps, statuses);

  const recentSnaps = fleetSnaps.filter((f) => {
    if (!f.last_run_ts) return false;
    const hrs = (Date.now() - new Date(f.last_run_ts).getTime()) / 3600000;
    return hrs < STALE_HOURS;
  });

  // Fleet-aggregate "last commit shipped" and counts for the optional
  // detail line.
  const fleetAgg = aggregateLastDispatch(fleetSnaps);
  const checkedIn = recentSnaps.length;
  const total = fleetSnaps.length;

  const div = document.createElement('div');
  div.className = `banner-v2 ${verdict.tier}`;

  div.appendChild(makeStatusDot(verdict.dotState, 'lg'));

  const text = document.createElement('div');
  text.className = 'banner-text';
  text.textContent = verdict.headline;

  // Detail line — only when fleet-aggregate data is available. Keeps the
  // happy path single-line.
  const detailParts = [];
  if (verdict.detail) {
    detailParts.push(verdict.detail);
  }
  if (fleetAgg.ts) {
    const fleetMs = Date.now() - new Date(fleetAgg.ts).getTime();
    if (Number.isFinite(fleetMs) && fleetMs >= 0) {
      const machineLabel = MACHINE_NAMES[fleetAgg.machine] || fleetAgg.machine || '?';
      detailParts.push(`Last commit ${formatDuration(fleetMs)} (${machineLabel})`);
    }
  }
  if (total > 0) {
    detailParts.push(`${checkedIn} of ${total} machines checked in within ${STALE_HOURS}h`);
  }
  if (detailParts.length > 0) {
    const detail = document.createElement('div');
    detail.className = 'banner-detail';
    detail.textContent = detailParts.join(' • ');
    text.appendChild(detail);
  }

  div.appendChild(text);
  banner.appendChild(div);
}

// "What's happening right now" — mini-table, one row per machine. The
// load-bearing top section per PLAN. Hidden if no fleet snapshots present.
function renderWhatsHappening(fleetSnaps) {
  const container = document.getElementById('whatsHappening');
  container.innerHTML = '';
  if (!Array.isArray(fleetSnaps) || fleetSnaps.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = "What's happening right now";
  container.appendChild(header);

  // Stable display order — keep MACHINE_NAMES order if known, then unknowns
  // alphabetically. Operators expect their fleet in the same slot every refresh.
  const knownOrder = Object.keys(MACHINE_NAMES);
  const sorted = [...fleetSnaps].sort((a, b) => {
    const ai = knownOrder.indexOf(a.machine || '');
    const bi = knownOrder.indexOf(b.machine || '');
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return String(a.machine || '').localeCompare(String(b.machine || ''));
  });

  for (const fleet of sorted) {
    const row = document.createElement('div');
    row.className = 'wh-row';

    const rawName = fleet.machine || (fleet.__file || '').replace(/^fleet-/, '').replace(/\.json$/, '');
    const friendly = MACHINE_NAMES[rawName] || rawName || '(unknown)';
    const status = computeMachineStatus(fleet);

    const nameEl = document.createElement('span');
    nameEl.className = 'wh-name';
    nameEl.textContent = friendly;
    row.appendChild(nameEl);

    const iconEl = document.createElement('span');
    iconEl.className = 'wh-icon';
    iconEl.appendChild(makePcIcon(status));
    row.appendChild(iconEl);

    const sentenceEl = document.createElement('span');
    sentenceEl.className = `wh-sentence ${status}`;
    sentenceEl.textContent = whatsHappeningSentence(fleet, status);
    row.appendChild(sentenceEl);

    // Kimi gate chip — ports the `Kimi gate: ...` line from
    // remote-status.mjs:172-188. After PR #33 the `weekly-floor-threatened`
    // skip is the new high-frequency reason; surfacing it on the row makes
    // the dispatcher's voluntary cap visible without SSHing.
    const kimiEl = buildKimiGateChip(fleet);
    if (kimiEl) row.appendChild(kimiEl);

    const quotaEl = buildQuotaTierChip(fleet);
    if (quotaEl) row.appendChild(quotaEl);

    container.appendChild(row);
  }
}

function buildKimiGateChip(fleet) {
  // Gate render is conditional on a kimi snapshot existing for this machine —
  // mirrors remote-status.mjs:177 (only print the Kimi line when generated_at
  // is present; otherwise the gist write-side just hadn't emitted it yet).
  if (!present(fleet?.kimi_generated_at)) return null;
  const auth = fleet.kimi_dispatch_authorized;
  let gateClass, gateText;
  if (auth === true) { gateClass = 'green'; gateText = 'green'; }
  else if (auth === false) { gateClass = 'red'; gateText = 'red'; }
  else { gateClass = 'unknown'; gateText = '?'; }
  const reason = present(fleet.kimi_skip_reason) ? ` (${fleet.kimi_skip_reason})` : '';
  const rh = fleet.kimi_rolling_5h_headroom_pct;
  const wh = fleet.kimi_weekly_headroom_pct;
  const headroom = (rh !== null && rh !== undefined && wh !== null && wh !== undefined)
    ? `  5h=${rh}% weekly=${wh}%`
    : '';
  const el = document.createElement('span');
  el.className = `wh-kimi ${gateClass}`;
  el.textContent = `kimi: ${gateText}${reason}${headroom}`;
  return el;
}

function buildQuotaTierChip(fleet) {
  // Per-pool quota tiers (opus/sonnet/kimi). Only render when a quota-state
  // snapshot exists for this machine (mirrors buildKimiGateChip's guard). The
  // chip's severity class tracks the WORST binding pool so an opus-red machine
  // reads red at a glance -- that is the state that triggered an engine demotion.
  if (!present(fleet?.quota_generated_at)) return null;
  const parts = [];
  const fmt = (label, tier, pct) => {
    if (!present(tier)) return;
    const p = (pct !== null && pct !== undefined) ? `(${pct}%)` : '';
    parts.push(`${label}=${String(tier).toUpperCase()}${p}`);
  };
  fmt('opus', fleet.quota_opus_tier, fleet.quota_opus_pct_used);
  fmt('sonnet', fleet.quota_sonnet_tier, fleet.quota_sonnet_pct_used);
  fmt('kimi', fleet.quota_kimi_tier, fleet.quota_kimi_pct_used);
  if (parts.length === 0) return null;
  const worst = present(fleet.quota_worst_tier) ? fleet.quota_worst_tier : 'unknown';
  const cls = ['green', 'yellow', 'orange', 'red'].includes(worst) ? worst : 'unknown';
  const el = document.createElement('span');
  el.className = `wh-quota ${cls}`;
  el.textContent = `quota: ${parts.join(' ')}`;
  return el;
}

// "Today's work" — three numbers: dispatches today vs cap, auto-commits
// today, pending merges count.
function renderTodaysWork(gist, fleetSnaps) {
  const container = document.getElementById('todaysWork');
  container.innerHTML = '';

  // Sum dispatches across the fleet. dispatches_today is per-machine; the
  // cap (dispatches_today_max) is a per-machine config but tends to match
  // across the fleet — we sum both so the ratio still reads correctly when
  // they don't.
  let usedSum = 0, capSum = 0, hasCap = false;
  for (const f of fleetSnaps || []) {
    if (Number.isFinite(Number(f.dispatches_today))) {
      usedSum += Number(f.dispatches_today);
    }
    if (Number.isFinite(Number(f.dispatches_today_max))) {
      capSum += Number(f.dispatches_today_max);
      hasCap = true;
    }
  }

  // Auto-commits in last 24h come from the auto-digest payloads (already
  // 24h-windowed by scripts/lib/auto-digest.mjs).
  const commits = aggregateAutoDigestCommits(gist);
  const projectsTouched = new Set(commits.map((c) => c.slug));

  // Pending merges — read for the pointer line count.
  const pmData = parseFile(gist, 'pending-merges.json');
  const pmEntries = Array.isArray(pmData?.entries) ? pmData.entries : [];
  const pmInflight = pmEntries.filter((e) => e && !e.completed && e.next_deadline_ms != null);

  // PRs merged to main in the last 24h (from the fleet snapshots' shipped
  // ledger — same source as the SHIPPED panel below). Computed before the
  // hide/show decision so a merge-only day still shows the panel.
  const mergedToday = collectFleetShipped(fleetSnaps).filter((r) => {
    const ms = Date.parse(r.mergedAt);
    return Number.isFinite(ms) && Date.now() - ms <= 86400000;
  }).length;

  // Hide the section entirely when there's nothing to say (cold start —
  // before any machine has uploaded today's counters and before the first
  // auto-digest payload). Otherwise render whichever rows have data.
  const hasAnyData = usedSum > 0 || commits.length > 0 || pmInflight.length > 0 || hasCap || mergedToday > 0;
  if (!hasAnyData) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = "Today's work";
  container.appendChild(header);

  // Stat tiles row: dispatches, auto-commits, merged to main.
  const tiles = document.createElement('div');
  tiles.className = 'stat-tiles';

  const tileDisp = document.createElement('div');
  tileDisp.className = 'stat-tile';
  const numDisp = document.createElement('div');
  numDisp.className = 'stat-num';
  numDisp.textContent = hasCap ? `${usedSum} / ${capSum}` : String(usedSum);
  const lblDisp = document.createElement('div');
  lblDisp.className = 'stat-label';
  lblDisp.textContent = 'Dispatches today';
  tileDisp.appendChild(numDisp);
  tileDisp.appendChild(lblDisp);
  tiles.appendChild(tileDisp);

  const tileCommits = document.createElement('div');
  tileCommits.className = 'stat-tile';
  const numCommits = document.createElement('div');
  numCommits.className = 'stat-num';
  numCommits.textContent = String(commits.length);
  const lblCommits = document.createElement('div');
  lblCommits.className = 'stat-label';
  lblCommits.textContent = 'Auto-commits';
  tileCommits.appendChild(numCommits);
  tileCommits.appendChild(lblCommits);
  if (projectsTouched.size > 0) {
    const subCommits = document.createElement('div');
    subCommits.className = 'stat-sublabel';
    subCommits.textContent = `across ${projectsTouched.size} project${projectsTouched.size === 1 ? '' : 's'}`;
    tileCommits.appendChild(subCommits);
  }
  tiles.appendChild(tileCommits);

  const tileMerged = document.createElement('div');
  tileMerged.className = 'stat-tile';
  const numMerged = document.createElement('div');
  numMerged.className = 'stat-num';
  numMerged.textContent = String(mergedToday);
  const lblMerged = document.createElement('div');
  lblMerged.className = 'stat-label';
  lblMerged.textContent = 'Merged to main';
  tileMerged.appendChild(numMerged);
  tileMerged.appendChild(lblMerged);
  if (mergedToday > 0) {
    const subMerged = document.createElement('div');
    subMerged.className = 'stat-sublabel';
    subMerged.textContent = '24h';
    tileMerged.appendChild(subMerged);
  }
  tiles.appendChild(tileMerged);

  container.appendChild(tiles);

  // Burn bar for dispatches.
  if (hasCap && capSum > 0) {
    const pct = (usedSum / capSum) * 100;
    container.appendChild(buildBurnBar('Dispatches today', pct, { warnAt: 80 }));
  }

  // Pending merges pointer line.
  if (pmInflight.length > 0) {
    const line = document.createElement('div');
    line.className = 'tw-row';
    const word = pmInflight.length === 1 ? 'PR' : 'PRs';
    line.textContent = `${pmInflight.length} ${word} waiting - see Pending merges below`;
    container.appendChild(line);
  }
}

// "SHIPPED" — merged-PR ledger from the per-machine fleet snapshots'
// control_room.shipped (buildShippedWork in control-room.mjs; rides the gist
// so this static mirror needs no local merge-tracker). Union across machines,
// deduped by slug#prNumber — several machines can track the same repo.
// Null-safe against pre-2026-07-13 snapshots without `shipped` (rollout skew
// across 4 machines is guaranteed). Hidden until any machine reports a merge.
function collectFleetShipped(fleetSnaps) {
  const seen = new Set();
  const rows = [];
  for (const f of fleetSnaps || []) {
    const byProject = f?.control_room?.shipped?.byProject;
    if (!byProject || typeof byProject !== 'object') continue;
    for (const [slug, items] of Object.entries(byProject)) {
      if (!Array.isArray(items)) continue;
      for (const it of items) {
        if (!it || !it.mergedAt) continue;
        const key = it.prNumber != null ? `${slug}#${it.prNumber}` : `${slug}${it.mergedAt}`;
        if (seen.has(key)) continue;
        seen.add(key);
        rows.push({
          slug,
          prNumber: it.prNumber ?? null,
          title: it.title ?? null,
          url: it.url ?? null,
          mergedAt: it.mergedAt,
          autonomous: it.autonomous === true,
          task: it.task ?? null,
        });
      }
    }
  }
  rows.sort((a, b) => String(b.mergedAt).localeCompare(String(a.mergedAt)));
  return rows;
}

function renderShipped(fleetSnaps) {
  const container = document.getElementById('shippedPanel');
  container.innerHTML = '';

  const rows = collectFleetShipped(fleetSnaps);
  if (rows.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const now = Date.now();
  const DAY = 86400000;
  const in7d = rows.filter((r) => {
    const ms = Date.parse(r.mergedAt);
    return Number.isFinite(ms) && now - ms <= 7 * DAY;
  }).length;

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = `Shipped — merged to main (${rows.length} in 30d, ${in7d} in 7d)`;
  container.appendChild(header);

  // Group consecutive same-project/same-description rows.
  const groups = [];
  for (const r of rows) {
    const parsed = displayPrTitle(r.title);
    const text = parsed.text || '(no title)';
    if (groups.length > 0) {
      const last = groups[groups.length - 1];
      if (last.slug === r.slug && last.text === text) {
        last.items.push(r);
        continue;
      }
    }
    groups.push({ slug: r.slug, text, task: parsed.task, items: [r] });
  }

  const table = document.createElement('table');
  table.className = 'ship-table';
  const colgroup = document.createElement('colgroup');
  const widths = ['20%', '14%', '36%', '14%', '16%'];
  for (const w of widths) {
    const col = document.createElement('col');
    col.style.width = w;
    colgroup.appendChild(col);
  }
  table.appendChild(colgroup);

  const thead = document.createElement('thead');
  const headTr = document.createElement('tr');
  for (const h of ['Project', 'Task', 'Description', 'Age', 'Kind']) {
    const th = document.createElement('th');
    th.textContent = h;
    headTr.appendChild(th);
  }
  thead.appendChild(headTr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const displayLimit = 12;
  for (let i = 0; i < Math.min(groups.length, displayLimit); i++) {
    tbody.appendChild(buildShippedGroupRow(groups[i]));
  }
  table.appendChild(tbody);
  container.appendChild(table);

  if (rows.length > displayLimit) {
    const more = document.createElement('div');
    more.className = 'ship-more';
    more.textContent = `...and ${rows.length - displayLimit} more in the last 30 days`;
    container.appendChild(more);
  }
}

function buildShippedGroupRow(g) {
  const first = g.items[0];
  const ms = Date.parse(first.mergedAt);
  const age = Number.isFinite(ms) ? agoMs(ms) : '—';
  const isAuto = first.autonomous === true;

  const tr = document.createElement('tr');
  if (g.items.length >= 2) {
    const td = document.createElement('td');
    td.colSpan = 5;

    const details = document.createElement('details');
    details.className = 'ship-group';

    const summary = document.createElement('summary');
    summary.className = 'ship-summary-row';

    const projSpan = document.createElement('span');
    projSpan.className = 'ship-col-proj';
    projSpan.textContent = g.slug;
    summary.appendChild(projSpan);

    const taskSpan = document.createElement('span');
    taskSpan.className = 'ship-col-task';
    if (g.task) {
      const badge = document.createElement('span');
      badge.className = 'task-badge';
      badge.textContent = g.task;
      taskSpan.appendChild(badge);
    }
    summary.appendChild(taskSpan);

    const descSpan = document.createElement('span');
    descSpan.className = 'ship-col-desc';
    if (typeof first.url === 'string' && /^https:\/\//.test(first.url)) {
      const a = document.createElement('a');
      a.href = first.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = g.text;
      descSpan.appendChild(a);
    } else {
      descSpan.textContent = g.text;
    }
    summary.appendChild(descSpan);

    const ageSpan = document.createElement('span');
    ageSpan.className = 'ship-col-age';
    ageSpan.textContent = age;
    summary.appendChild(ageSpan);

    const chipSpan = document.createElement('span');
    chipSpan.className = 'ship-col-chip';
    const chip = document.createElement('span');
    chip.className = isAuto ? 'tag ok' : 'tag dim';
    chip.textContent = isAuto ? 'auto' : 'manual';
    chipSpan.appendChild(chip);
    const countBadge = document.createElement('span');
    countBadge.className = 'ship-count';
    countBadge.textContent = 'x' + g.items.length;
    chipSpan.appendChild(countBadge);
    summary.appendChild(chipSpan);

    details.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'ship-group-body';
    for (const it of g.items) {
      const line = document.createElement('div');
      const itMs = Date.parse(it.mergedAt);
      const itAge = Number.isFinite(itMs) ? agoMs(itMs) : '—';
      const num = it.prNumber != null ? '#' + it.prNumber : '(no #)';
      line.textContent = `${num} - ${itAge}`;
      body.appendChild(line);
    }
    details.appendChild(body);

    td.appendChild(details);
    tr.appendChild(td);
  } else {
    const projTd = document.createElement('td');
    projTd.textContent = g.slug;
    tr.appendChild(projTd);

    const taskTd = document.createElement('td');
    if (g.task) {
      const badge = document.createElement('span');
      badge.className = 'task-badge';
      badge.textContent = g.task;
      taskTd.appendChild(badge);
    }
    tr.appendChild(taskTd);

    const descTd = document.createElement('td');
    if (typeof first.url === 'string' && /^https:\/\//.test(first.url)) {
      const a = document.createElement('a');
      a.href = first.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = g.text;
      descTd.appendChild(a);
    } else {
      descTd.textContent = g.text;
    }
    tr.appendChild(descTd);

    const ageTd = document.createElement('td');
    ageTd.textContent = age;
    tr.appendChild(ageTd);

    const kindTd = document.createElement('td');
    const chip = document.createElement('span');
    chip.className = isAuto ? 'tag ok' : 'tag dim';
    chip.textContent = isAuto ? 'auto' : 'manual';
    kindTd.appendChild(chip);
    tr.appendChild(kindTd);
  }
  return tr;
}

// "Is rotation working?" — derives from auto-digest commit timeline. Hidden
// until there's enough data (>= 3 commits) for the answer to be meaningful.
function renderRotation(gist) {
  const container = document.getElementById('rotationPanel');
  container.innerHTML = '';

  const commits = aggregateAutoDigestCommits(gist);
  const WINDOW_SIZE = 10;
  // Threshold tuning: a project is flagged "stuck" when it exceeds this
  // fraction of the recent window. 0.6 is intentionally lenient — bursty
  // commit patterns inside a single dispatch can briefly approach 0.5
  // without indicating a stuck rotation.
  const STUCK_THRESHOLD = 0.6;
  const window_ = commits.slice(0, WINDOW_SIZE);
  if (window_.length < 3) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = 'Is rotation working?';
  container.appendChild(header);

  // Count how many times each project shows up in the recent window.
  const counts = new Map();
  for (const c of window_) counts.set(c.slug, (counts.get(c.slug) || 0) + 1);
  const distinct = counts.size;
  const dominant = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const isStuck = dominant && dominant[1] / window_.length > STUCK_THRESHOLD;

  // Sequence (newest → oldest, already sorted by aggregator).
  const seq = document.createElement('div');
  seq.className = 'rot-seq';
  seq.appendChild(document.createTextNode(`Last ${window_.length} commits: `));
  for (const c of window_) {
    const slug = document.createElement('span');
    slug.className = 'rot-slug';
    if (isStuck && c.slug === dominant[0]) slug.classList.add('dominant');
    slug.textContent = c.slug;
    seq.appendChild(slug);
  }
  container.appendChild(seq);

  const verdict = document.createElement('div');
  if (isStuck) {
    verdict.className = 'rot-verdict stuck';
    verdict.appendChild(makeStatusDot('broken'));
    verdict.appendChild(document.createTextNode(
      ` Stuck — ${dominant[0]} ran ${dominant[1]} of ${window_.length} times. Selector backoff or a project failing every cycle.`
    ));
  } else {
    verdict.className = 'rot-verdict ok';
    verdict.appendChild(makeStatusDot('running'));
    verdict.appendChild(document.createTextNode(
      ` Rotating — ${distinct} distinct ${distinct === 1 ? 'project' : 'projects'} in the last ${window_.length} commits.`
    ));
  }
  container.appendChild(verdict);
}

// "Things needing your attention" — hides when empty. Sources: stale-from-
// membership, consecutive_errors >= 3 per machine. Pending-merges age and
// canary-failure rules are deferred to a future pass — the data shapes for
// "open since" and "canary failed last cycle" need extra work that doesn't
// belong in v1.
function renderAttention(gist, fleetSnaps) {
  const container = document.getElementById('attentionPanel');
  container.innerHTML = '';

  const entries = [];
  // Track Rule A machines so Rule C can enrich an existing row instead of
  // double-listing the same machine when it has both 3 consecutive errors
  // and a structural-failure-with-candidates.
  const ruleAEntryByMachine = new Map();

  // Rule A: any machine with >= 3 consecutive errors.
  for (const f of fleetSnaps || []) {
    const errs = Number(f?.consecutive_errors) || 0;
    if (errs < 3) continue;
    const friendly = MACHINE_NAMES[f.machine] || f.machine || '(unknown)';
    const phase = phaseToStage(f.last_error_phase);
    const headline = `${friendly} has errored ${errs} cycles in a row.`;
    let detail;
    if (phase) {
      detail = `Last failure at stage ${phase.num ?? phase.label} (${phase.label}). Open the per-machine card below for the diagnostics drawer.`;
    } else if (present(f.last_error_reason)) {
      detail = `Reason: ${f.last_error_reason}. Diagnostics drawer below has the message.`;
    } else {
      detail = 'Open the per-machine card below for the diagnostics drawer.';
    }
    const entry = { tier: 'err', headline, detail, machine: f.machine };
    entries.push(entry);
    if (f.machine) ruleAEntryByMachine.set(f.machine, entry);
  }

  // Rule B: stale machines from fleet-membership.json verdict. Both `stale`
  // (>= 4h since last run) and `missing` (no fleet file) are interesting.
  const membership = parseFile(gist, 'fleet-membership.json');
  const verdict = membership?.verdict;
  if (verdict) {
    for (const m of verdict.stale || []) {
      const friendly = MACHINE_NAMES[m.name] || m.name || '(unknown)';
      const ageH = present(m.age_hours)
        ? `${Number(m.age_hours).toFixed(1)}h`
        : 'a while';
      entries.push({
        tier: 'warn',
        headline: `${friendly} hasn't checked in for ${ageH}.`,
        detail: 'Could be: PC asleep, scheduled task disabled, or canary failing. Open the laptop / PC and check the dispatcher service.',
        machine: m.name,
      });
    }
    for (const m of verdict.missing || []) {
      if (m.monitor_only) continue;
      const friendly = MACHINE_NAMES[m.name] || m.name || '(unknown)';
      entries.push({
        tier: 'err',
        headline: `${friendly} has no fleet file at all.`,
        detail: 'Either it has never run, or the gist write is failing. Check GIST_AUTH_TOKEN scope on that machine.',
        machine: m.name,
      });
    }
  }

  // Rule C: per-machine structural-failure context from health-<machine>.json.
  // Mirrors the `Failure ctx: ... candidates=[...]` line from remote-status.mjs
  // (lines 203-214) so the operator can see which models were tried-and-rejected
  // by a project-scoped local.json override without SSHing into the failing PC.
  // Only fires when the machine is degraded/down with a project-scoped failure
  // — for healthy/idle machines this would be noise.
  for (const f of fleetSnaps || []) {
    if (!f?.machine) continue;
    // parseFile() returns {} on missing, never null — plain `.` is sufficient.
    const health = parseFile(gist, `health-${f.machine}.json`);
    const sf = health.last_structural_failure;
    if (!sf || !sf.project) continue;
    if (health.state !== 'degraded' && health.state !== 'down') continue;
    const cands = Array.isArray(sf.candidates) && sf.candidates.length
      ? `candidates=[${sf.candidates.join(',')}]`
      : '';
    const cls = sf.task_class ? ` class=${sf.task_class}` : '';
    // health.mjs doesn't strictly require sf.task alongside sf.project; fall
    // back to '?' so we never render "project/undefined".
    const task = sf.task || '?';
    const ctx = `${sf.reason} on ${sf.project}/${task}${cls}${cands ? ' ' + cands : ''}`;
    const ruleAEntry = ruleAEntryByMachine.get(f.machine);
    if (ruleAEntry) {
      // Enrich the existing Rule A row rather than double-listing the machine.
      ruleAEntry.detail = ruleAEntry.detail
        ? `${ruleAEntry.detail} Failure ctx: ${ctx}.`
        : `Failure ctx: ${ctx}.`;
      continue;
    }
    const friendly = MACHINE_NAMES[f.machine] || f.machine || '(unknown)';
    const tier = health.state === 'down' ? 'err' : 'warn';
    entries.push({
      tier,
      headline: `${friendly} is ${health.state}: ${sf.reason}.`,
      detail: `Failure ctx: ${ctx}.`,
      machine: f.machine,
    });
  }

  // Rule C2: struggling machines — pipeline healthy but recent work reverted
  // by the safety nets (health.mjs five-state model, 2026-07-14). These have
  // no last_structural_failure by construction, so Rule C can't surface them;
  // the health reason line carries the whole story. warn tier: model quality,
  // not infra.
  for (const f of fleetSnaps || []) {
    if (!f?.machine) continue;
    const health = parseFile(gist, `health-${f.machine}.json`);
    if (health.state !== 'struggling') continue;
    if (ruleAEntryByMachine.get(f.machine)) continue; // already listed for errors
    const friendly = MACHINE_NAMES[f.machine] || f.machine || '(unknown)';
    entries.push({
      tier: 'warn',
      headline: `${friendly} is struggling: recent work reverted by safety nets.`,
      detail: health.reason || '',
      machine: f.machine,
    });
  }

  // Rule D: rotation attrition — disabled projects per machine (fleet.mjs
  // buildDisabledProjects, 2026-07-13). The auto-disable ratchet quietly bled
  // perrypc down to 1 live project of 10 with no surface showing it; this
  // rule makes attrition a first-class attention item. warn when any project
  // is disabled; err when at most one rotation project survives.
  for (const f of fleetSnaps || []) {
    const disabled = Array.isArray(f?.disabled_projects) ? f.disabled_projects : [];
    const total = Number(f?.rotation_total) || 0;
    if (!f?.machine || disabled.length === 0 || total === 0) continue;
    const friendly = MACHINE_NAMES[f.machine] || f.machine || '(unknown)';
    const survivors = total - disabled.length;
    const tier = survivors <= 1 ? 'err' : 'warn';
    const list = disabled.map((d) => {
      const sinceMs = d?.since ? Date.parse(d.since) : NaN;
      const ageD = Number.isFinite(sinceMs)
        ? ` since ${Math.max(0, Math.floor((Date.now() - sinceMs) / 86400000))}d`
        : '';
      const kind = d?.kind === 'auto' ? 'auto' : 'operator';
      return `${d?.slug ?? '?'} (${kind}${ageD})`;
    }).join(', ');
    entries.push({
      tier,
      headline: `${friendly}: ${disabled.length} of ${total} rotation projects disabled${survivors <= 1 ? ' — rotation nearly empty' : ''}.`,
      detail: `Disabled: ${list}. Auto-disabled projects revive via reenabled_at stamp in that machine's config/local.json.`,
      machine: f.machine,
    });
  }

  if (entries.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = `Things needing your attention (${entries.length})`;
  container.appendChild(header);

  for (const e of entries) {
    const row = document.createElement('div');
    row.className = 'att-row';
    const headline = document.createElement('div');
    headline.className = `att-headline ${e.tier}`;
    headline.appendChild(makeStatusDot(e.tier === 'err' ? 'broken' : 'waiting'));
    headline.appendChild(document.createTextNode(' ' + e.headline));
    row.appendChild(headline);
    if (e.detail) {
      const det = document.createElement('div');
      det.className = 'att-detail';
      det.textContent = e.detail;
      row.appendChild(det);
    }
    if (e.machine) {
      const jump = document.createElement('a');
      jump.className = 'att-detail';
      jump.href = '#machine-' + esc(e.machine);
      jump.style.color = 'var(--accent)';
      jump.style.marginTop = '4px';
      jump.style.display = 'inline-block';
      jump.textContent = 'Show machine details →';
      jump.onclick = (ev) => {
        ev.preventDefault();
        const card = document.getElementById('machine-' + esc(e.machine));
        if (card) {
          card.open = true;
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
      row.appendChild(jump);
    }
    container.appendChild(row);
  }
}

// === Model tier ladder ===
// Shows the dispatcher's model-routing ladder and which tier is currently
// active across the fleet. Claude is always shown as dormant because this
// streamlined view focuses on free-tier consistency.
function renderModelTier(fleetSnaps) {
  const container = document.getElementById('modelTierPanel');
  container.innerHTML = '';

  const rungs = [
    { tier: 0, name: 'Local', cost: 'Ollama / local GPU', dormant: false },
    { tier: 1, name: 'Free primary', cost: 'GLM-4-Flash', dormant: false },
    { tier: 2, name: 'Free fallback', cost: 'Gemini / Mistral / Codestral', dormant: false },
    { tier: 3, name: 'Kimi', cost: '$19/mo Allegretto', dormant: true },
    { tier: 4, name: 'Claude', cost: 'Max subscription', dormant: true },
  ];

  // Determine active tier from the most recent fleet snap that has a model.
  let activeTier = -1;
  let currentModel = null;
  let currentTaskClass = null;
  let currentMachine = null;
  let fallbackReason = null;
  let currentTs = 0;
  for (const f of fleetSnaps || []) {
    const model = f.last_model;
    if (!model) continue;
    const tier = modelTierFromName(model);
    const ts = f.last_run_ts ? new Date(f.last_run_ts).getTime() : 0;
    if (ts && ts > currentTs) {
      activeTier = tier;
      currentModel = model;
      currentTaskClass = f.last_task_class;
      currentMachine = f.machine;
      fallbackReason = f.last_selector_fallback_reason;
      currentTs = ts;
    }
  }

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = 'Model tier / routing';
  container.appendChild(header);

  const ladder = document.createElement('div');
  ladder.className = 'mt-ladder';
  for (const r of rungs) {
    const active = r.tier === activeTier;
    const el = document.createElement('div');
    el.className = `mt-rung ${active ? 'active' : ''} ${r.dormant ? 'dormant' : ''}`;
    el.innerHTML = `<span class="mt-dot t${r.tier}"></span><span class="mt-name">${esc(r.name)}</span><span class="mt-cost">${esc(r.cost)}</span>`;
    ladder.appendChild(el);
  }
  container.appendChild(ladder);

  if (currentModel) {
    const cur = document.createElement('div');
    cur.className = 'mt-current';
    const label = document.createElement('div');
    label.className = 'mt-current-label';
    label.textContent = fallbackReason
      ? `Latest dispatch used fallback routing:`
      : `Latest dispatch routed to:`;
    cur.appendChild(label);
    const row = document.createElement('div');
    row.className = 'mt-current-row';
    row.innerHTML = `
      <span>Model: <code>${esc(currentModel)}</code></span>
      <span>Tier: <code>${esc(String(activeTier))}</code></span>
      ${currentTaskClass ? `<span>Task class: <code>${esc(currentTaskClass)}</code></span>` : ''}
      ${currentMachine ? `<span>Machine: <code>${esc(MACHINE_NAMES[currentMachine] || currentMachine)}</code></span>` : ''}
      ${fallbackReason ? `<span>Fallback: <code>${esc(fallbackReason)}</code></span>` : ''}
    `;
    cur.appendChild(row);
    container.appendChild(cur);
  }

  container.style.display = '';
}

function modelTierFromName(model) {
  const m = String(model || '').toLowerCase();
  if (m.startsWith('local/')) return 0;
  if (m.startsWith('glm-4')) return 1;
  if (m.startsWith('gemini') || m.startsWith('mistral') || m.startsWith('codestral')) return 2;
  if (m.includes('kimi')) return 3;
  if (m.includes('claude')) return 4;
  return 2; // unknown free-tier fallback
}

// === Recent substitutions ===
// Surfaces soft-substitute firing events (selector-fallback + autofix model
// swaps) across the fleet. Each machine's recent_substitutions array lives in
// health-<machine>.json (health.mjs computeHealth()), not the fleet-*.json
// snapshot fleetSnaps is built from -- mirrors the health-<machine>.json read
// pattern in renderAttention()'s Rule C above.
function renderRecentSubstitutions(gist, fleetSnaps) {
  const container = document.getElementById('recentSubstitutionsPanel');
  container.innerHTML = '';

  const rows = [];
  for (const f of fleetSnaps || []) {
    if (!f?.machine) continue;
    // parseFile() returns {} on missing, never null.
    const health = parseFile(gist, `health-${f.machine}.json`);
    const subs = Array.isArray(health.recent_substitutions) ? health.recent_substitutions : [];
    for (const s of subs) rows.push({ ...s, machine: f.machine });
  }
  rows.sort((a, b) => {
    const ta = a.ts ? new Date(a.ts).getTime() : 0;
    const tb = b.ts ? new Date(b.ts).getTime() : 0;
    return tb - ta;
  });

  if (rows.length === 0) {
    container.style.display = 'none';
    return;
  }

  const details = document.createElement('details');
  details.className = 'panel-details';

  const summary = document.createElement('summary');
  summary.className = 'panel-summary ts-header';
  summary.textContent = `Recent soft substitutions (${rows.length})`;
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'panel-body';

  const table = document.createElement('table');
  table.className = 'rs-table';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Time</th><th>Machine</th><th>Kind</th><th>From → To</th><th>Project / task</th><th>Reason</th></tr>';
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (const r of rows.slice(0, 10)) {
    const tr = document.createElement('tr');
    const friendly = MACHINE_NAMES[r.machine] || r.machine || '(unknown)';
    const from = present(r.from) ? esc(r.from) : '—';
    const to = present(r.to) ? esc(r.to) : '—';
    const projTask = [r.project, r.task].filter(present).join(' / ') || '—';
    tr.innerHTML = `
      <td>${r.ts ? esc(ago(r.ts)) : '—'}</td>
      <td>${esc(friendly)}</td>
      <td>${esc(r.kind || '—')}</td>
      <td>${from} → ${to}</td>
      <td>${esc(projTask)}</td>
      <td>${present(r.reason) ? esc(r.reason) : '—'}</td>
    `;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  body.appendChild(table);

  details.appendChild(body);
  container.appendChild(details);
  container.style.display = '';
}

// === Error context cards ===
// Renders the most recent structured error_context blocks from the fleet
// snapshots, with a one-click copy button for pasting into Claude/Kimi.
function renderErrorContext(fleetSnaps) {
  const container = document.getElementById('errorContextPanel');
  container.innerHTML = '';

  const cards = [];
  for (const f of fleetSnaps || []) {
    const ctx = f.last_error_context;
    if (!ctx || typeof ctx !== 'object') continue;
    cards.push({ ts: f.last_error_ts || f.last_run_ts, machine: f.machine, ctx });
  }
  cards.sort((a, b) => {
    const ta = a.ts ? new Date(a.ts).getTime() : 0;
    const tb = b.ts ? new Date(b.ts).getTime() : 0;
    return tb - ta;
  });

  if (cards.length === 0) {
    container.style.display = 'none';
    return;
  }

  const details = document.createElement('details');
  details.className = 'panel-details';
  details.open = true;

  const summary = document.createElement('summary');
  summary.className = 'panel-summary ts-header';
  summary.textContent = `Errors needing attention (${cards.length})`;
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'panel-body';

  for (const c of cards.slice(0, 3)) {
    const ctx = c.ctx;
    const card = document.createElement('div');
    card.className = `ec-card ${ctx.severity === 'warn' ? 'warn' : ''}`;

    const head = document.createElement('div');
    head.className = 'ec-head';
    const left = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'ec-title';
    title.textContent = ctx.summary || ctx.reason || 'Dispatch error';
    left.appendChild(title);
    const meta = document.createElement('div');
    meta.className = 'ec-meta';
    const parts = [];
    if (c.ts) parts.push(ago(c.ts));
    if (c.machine) parts.push(MACHINE_NAMES[c.machine] || c.machine);
    if (ctx.phase) parts.push(`phase: ${ctx.phase}`);
    if (ctx.model_tier_label) parts.push(ctx.model_tier_label);
    meta.textContent = parts.join(' • ');
    left.appendChild(meta);
    head.appendChild(left);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'ec-copy';
    copyBtn.textContent = 'Copy for Claude/Kimi';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(ctx.copy_context || formatCopyContext(ctx)).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy for Claude/Kimi', 1500);
      }).catch(() => {
        copyBtn.textContent = 'Copy failed';
      });
    };
    head.appendChild(copyBtn);
    card.appendChild(head);

    if (ctx.suggested_action) {
      const action = document.createElement('div');
      action.className = 'ec-action';
      action.textContent = `Suggested: ${ctx.suggested_action}`;
      card.appendChild(action);
    }

    const pre = document.createElement('pre');
    pre.className = 'ec-pre';
    pre.textContent = ctx.copy_context || formatCopyContext(ctx);
    pre.style.display = 'none';
    card.appendChild(pre);

    const toggle = document.createElement('span');
    toggle.className = 'ec-toggle';
    toggle.textContent = 'Show full context';
    toggle.onclick = () => {
      const hidden = pre.style.display === 'none';
      pre.style.display = hidden ? '' : 'none';
      toggle.textContent = hidden ? 'Hide full context' : 'Show full context';
    };
    card.appendChild(toggle);

    body.appendChild(card);
  }

  details.appendChild(body);
  container.appendChild(details);
  container.style.display = '';
}

function formatCopyContext(ctx) {
  // Fallback formatter for snapshots that pre-date the copy_context field.
  const lines = [
    '## Dispatcher failure context',
    '',
    `- **Project:** \`${ctx.project || 'unknown'}\``,
    `- **Task:** \`${ctx.task || 'unknown'}\``,
    `- **Phase:** \`${ctx.phase || 'unknown'}\``,
    `- **Outcome:** \`${ctx.outcome || 'unknown'}\``,
    `- **Reason:** ${ctx.reason || 'unknown'}`,
  ];
  if (ctx.model) lines.push(`- **Model:** \`${ctx.model}\` (${ctx.model_tier_label || 'tier unknown'})`);
  if (ctx.audit_model) lines.push(`- **Audit model:** \`${ctx.audit_model}\``);
  lines.push('', '### Suggested action', ctx.suggested_action || 'Investigate the details below.');
  if (ctx.command) {
    const cmd = Array.isArray(ctx.command) ? ctx.command.join(' ') : String(ctx.command);
    lines.push('', '### Command that failed', '```bash', cmd, '```');
  }
  if (ctx.stdout_tail) lines.push('', '### Stdout tail', '```', String(ctx.stdout_tail).slice(-2000), '```');
  if (ctx.stderr_tail) lines.push('', '### Stderr tail', '```', String(ctx.stderr_tail).slice(-2000), '```');
  if (ctx.exit_code != null) lines.push('', `- **Exit code:** ${ctx.exit_code}`);
  return lines.join('\n') + '\n';
}

// === Render ===

function refreshMachineNames(gist) {
  // Rebuild MACHINE_NAMES from fleet-membership.json so new machines added to
  // config/shared.json:expected_machines appear without an HTML edit. The
  // membership-check.mjs verdict spreads each expected_machines entry across
  // active/stale/missing arrays — walk all three and union the (node_id, name)
  // pairs. Seed from MACHINE_NAMES_FALLBACK first so the fallback ordering is
  // preserved for known machines and only NEW ones get appended.
  MACHINE_NAMES = { ...MACHINE_NAMES_FALLBACK };
  const verdict = parseFile(gist, 'fleet-membership.json')?.verdict;
  if (!verdict) return;
  for (const arr of [verdict.active, verdict.stale, verdict.missing]) {
    for (const entry of (arr || [])) {
      if (entry?.node_id && entry?.name) MACHINE_NAMES[entry.node_id] = entry.name;
    }
  }
}

function render(gist) {
  // Refresh the machine-name map before anything else renders, so all
  // downstream panels see config/shared.json's roster (via fleet-membership)
  // not just the hardcoded fallback.
  refreshMachineNames(gist);
