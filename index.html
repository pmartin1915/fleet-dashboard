<!DOCTYPE html>
<!--
  MIRROR SYNC REMINDER — read before editing.

  This file is the source of truth, but the LIVE dashboard is served from a
  separate public repo (the budget-dispatcher repo is private, so its Pages
  endpoint no longer serves on the free tier).

    Public mirror:   https://github.com/pmartin1915/fleet-dashboard
    Live URL:        https://pmartin1915.github.io/fleet-dashboard/
    Mirrored as:     index.html at the mirror's repo root (Pages: main / `/`)

  After editing this file, push the updated content to the mirror so the
  live site doesn't drift. One-liner using gh:

    pwsh scripts/sync-fleet-dashboard.ps1

  See memory reference_fleet_dashboard_hosting.md for the rationale (parent
  repo went private 2026-05-18; manual sync was the chosen cutover plan).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleet">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./fuzzball-192.png" type="image/png">
<link rel="apple-touch-icon" href="./fuzzball-192.png">
<title>Dispatcher Fleet</title>
<style>
  :root {
    /* Light-first token sheet (2026-07-13 readability redesign).
       Contrast ratios, computed against the surface they sit on:
         --text     #1c2433 on --surface #ffffff = 15.4:1 (AAA)
         --text     #1c2433 on --bg      #f4f6f9 = 14.1:1 (AAA)
         --text-dim #556179 on --surface #ffffff =  6.3:1 (AA)
         --accent   #1d4ed8 on --surface #ffffff =  6.3:1 (AA)
         --green    #1a7f37 on --surface #ffffff =  4.9:1 (AA)
         --yellow   #9a6700 on --surface #ffffff =  4.9:1 (AA)  (amber INK, not neon)
         --red      #b3261e on --surface #ffffff =  5.9:1 (AA)
         --cyan     #0e7490 on --surface #ffffff =  5.0:1 (AA)
       Status colors are dark inks paired with pale tint backgrounds
       (--*-bg) — tinted chip + dark text, never light-on-light.
       A future dark mode = one [data-theme="dark"] block overriding these
       same custom properties; keep every rule below referencing tokens. */
    --bg: #f4f6f9; --surface: #ffffff; --surface2: #eaeef4; --border: #d3dae4;
    --text: #1c2433; --text-dim: #556179; --accent: #1d4ed8;
    --green: #1a7f37; --yellow: #9a6700; --red: #b3261e; --cyan: #0e7490;
    --amber: #9a6700;
    --green-bg: #e6f4ea; --yellow-bg: #fcf3d7; --red-bg: #fbeae9;
    --accent-bg: #e8effd;
    --font-ui: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, system-ui, sans-serif;
    --font-mono: 'Cascadia Code', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg); color: var(--text);
    padding: 16px; max-width: 660px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  /* Telemetry stays monospace: identifiers, log lines, code wells. Prose
     (sentences, labels, headlines) rides the UI face set on body. */
  pre, code, .cr-feed, .rs-table, .rot-slug, .tw-pr-link, .cr-chip,
  .cr-timeline-slug, .cr-timeline-sha, .cr-timeline-diff, .wh-kimi, .wh-quota {
    font-family: var(--font-mono);
  }
  /* Desktop bump — at >=900px viewport the 660px column leaves the
     burn-bar and what's-happening rows feeling cramped while a 1080p
     monitor has plenty of horizontal real estate. Bumping to 860px gives
     the information-dense panels room to breathe without overshooting
     into a layout the mobile-first CSS wasn't designed for. */
  @media (min-width: 900px) {
    body { max-width: 860px; padding: 24px; }
  }
  h1 { font-size: 24px; font-weight: 650; margin-bottom: 4px; letter-spacing: -0.01em; }
  .subtitle { font-size: 15px; color: var(--text-dim); margin-bottom: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 10px;
  }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .machine-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .machine-dot.ok { background: var(--green); }
  .machine-dot.warn { background: var(--yellow); }
  .machine-dot.err { background: var(--red); }
  .machine-dot.stale { background: var(--text-dim); }

  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .row .label { color: var(--text-dim); }
  .row .value { color: var(--text); }
  .row .value.success { color: var(--green); }
  .row .value.error { color: var(--red); }
  .row .value.warn { color: var(--yellow); }
  .row .value.accent { color: var(--accent); }

  .tag {
    display: inline-block; font-size: 12px; padding: 1px 6px;
    border-radius: 3px; font-weight: 500;
  }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.warn { background: var(--yellow-bg); color: var(--yellow); }
  .tag.err { background: var(--red-bg); color: var(--red); }
  .tag.dim { background: var(--surface2); color: var(--text-dim); }

  .error-hint {
    font-size: 12px; color: var(--text-dim); font-style: italic;
    margin-top: 4px; padding: 4px 8px;
    border-left: 2px solid var(--text-dim);
    word-break: break-word;
  }

  /* Burn bar — visual gauge for weekly_pct / dispatches_today usage.
     Color tier matches the underlying gate semantics: <=80% green,
     80-100% yellow (approaching the floor), >100% red (over). */
  /* iOS Safari < 14.5 doesn't support flex `gap`; use margin-right on
     non-last children instead. Same pattern the rest of this file follows. */
  .burn-bar-wrap {
    display: flex; align-items: center;
    font-size: 13px; padding: 3px 0;
  }
  .burn-bar-wrap > *:not(:last-child) { margin-right: 8px; }
  .burn-bar-wrap .label { color: var(--text-dim); flex-shrink: 0; min-width: 100px; }
  .burn-bar {
    flex: 1; height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden; min-width: 60px;
  }
  .burn-bar-fill { height: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .burn-bar-fill { transition: width 0.3s ease; }
  }
  .burn-bar-fill.green { background: var(--green); }
  .burn-bar-fill.yellow { background: var(--yellow); }
  .burn-bar-fill.red { background: var(--red); }
  .burn-pct {
    font-size: 12px; flex-shrink: 0; min-width: 48px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .burn-pct.green { color: var(--green); }
  .burn-pct.yellow { color: var(--yellow); }
  .burn-pct.red { color: var(--red); }
  .burn-pct.dim { color: var(--text-dim); }

  /* Per-machine detail — collapsed by default in Step 3 of the redesign.
     Wraps the existing .card content in <details>; <summary> is the
     at-a-glance click target (dot + name), the body (rows + nested
     diagnostics drawer) is hidden until the operator opens the card.
     The mini "what's happening" table above already covers the 95% case;
     these cards are the deep dive. */
  .machine-collapsed { padding: 0; }
  .machine-collapsed > summary {
    cursor: pointer; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(29,78,216,0.12);
    list-style: none;
    min-height: 44px;
    padding: 12px 16px;
    display: flex; align-items: center;
    font-size: 14px; font-weight: 600;
  }
  .machine-collapsed > summary::-webkit-details-marker { display: none; }
  .machine-collapsed > summary::before {
    content: '\25B8'; color: var(--accent);
    margin-right: 8px; display: inline-block;
    flex-shrink: 0;
  }
  .machine-collapsed[open] > summary::before { content: '\25BE'; }
  .machine-collapsed > summary > .machine-dot { margin-right: 8px; }
  .machine-collapsed > summary > .ms-name { color: var(--text); }
  .machine-collapsed > summary > .ms-tail {
    margin-left: auto; font-size: 12px; font-weight: 400;
    color: var(--text-dim);
  }
  .machine-collapsed > summary > .ms-tail.warn { color: var(--yellow); }
  .machine-collapsed > summary > .ms-tail.err  { color: var(--red); }
  .machine-collapsed > .machine-body {
    padding: 12px 16px 14px;
    border-top: 1px solid var(--border);
  }
  .machines-header {
    font-size: 12px; font-weight: 600; color: var(--cyan);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin: 18px 0 8px;
  }

  .diag-drawer {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(28,36,51,0.10);
  }
  .diag-drawer summary {
    cursor: pointer; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(29,78,216,0.12);
    font-size: 13px; color: var(--accent);
    list-style: none;
    min-height: 44px;
    display: flex; align-items: center;
  }
  .diag-drawer summary::-webkit-details-marker { display: none; }
  .diag-drawer summary::before {
    content: '\25B8'; color: var(--accent);
    margin-right: 6px; display: inline-block;
  }
  .diag-drawer[open] summary::before { content: '\25BE'; }
  .diag-drawer .field-label {
    font-size: 12px; color: var(--text-dim);
    margin-top: 6px; margin-bottom: 2px;
  }
  .diag-drawer pre {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px;
    font-family: inherit; font-size: 12px; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow: auto;
  }

  /* Expected-fleet panel (Proposal D). One compact row per machine in the
     committed roster (config/shared.json:expected_machines) with an active /
     stale / missing badge. The watchdog answers "is anyone alive?"; this
     answers "are all the machines we expect actually writing?". */
  .expected-fleet {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 13px;
  }
  .ef-header {
    font-size: 12px; font-weight: 600; color: var(--cyan);
    letter-spacing: 0.04em; margin-bottom: 6px;
  }
  .ef-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0; font-size: 13px;
  }
  .ef-row .ef-name { color: var(--text); }
  .ef-row .ef-detail { color: var(--text-dim); font-size: 12px; }
  .ef-badge {
    display: inline-block; font-size: 12px; padding: 1px 6px;
    border-radius: 3px; font-weight: 500; margin-left: 8px;
  }
  .ef-badge.active { background: var(--green-bg); color: var(--green); }
  .ef-badge.stale { background: var(--yellow-bg); color: var(--yellow); }
  .ef-badge.missing { background: var(--red-bg); color: var(--red); }

  /* Auto-digest panel — recent auto/* commits across the fleet. Sources are
     auto-digest-<machine>.json gist files written each Phase -1.5 dispatch
     run. Hidden until at least one machine has uploaded a snapshot. */
  .auto-digest {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 13px;
  }
  .ad-header {
    font-size: 12px; font-weight: 600; color: var(--cyan);
    letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .ad-section {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-top: 8px; margin-bottom: 4px;
  }
  .ad-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0; font-size: 13px;
  }
  .ad-name { color: var(--text); }
  .ad-detail { color: var(--text-dim); font-size: 12px; }
  .ad-count {
    color: var(--green); font-weight: 600;
    font-size: 12px; margin-left: 8px;
    font-variant-numeric: tabular-nums;
  }
  .ad-count.zero { color: var(--text-dim); font-weight: 400; }

  /* === Control Room - Soviet-reactor instrument panel ===
     Aesthetic restyle (2026-06-08): backlit indicator lamps + annunciator
     telemetry strip, matching the local dashboard.mjs Control Room tab.
     Scoped under #controlRoomPanel; render JS is untouched. ASCII-only. */
  #controlRoomPanel {
    /* Light remap of the instrument-panel locals: the "recessed well"
       becomes a pale inset panel, amber phosphor becomes amber INK
       (#7a5200 = 6.4:1 on --surface), etched labels use the shared dim. */
    --cr-steel-2: #eef1f7; --cr-amber: #7a5200; --cr-label: var(--text-dim);
  }
  /* COMPOUNDING master lamp on the public mirror: answers "is it landing code?"
     so green/liveness cannot hide a dead compound loop. */
  #controlRoomPanel .cr-compounding {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin: 8px 0 12px; padding: 9px 13px; border-radius: 5px;
    border: 1px solid var(--border); border-left-width: 5px; font-size: 13px; color: var(--cr-label);
    background: var(--cr-steel-2);
    box-shadow: 0 1px 2px rgba(16,24,40,0.06);
  }
  #controlRoomPanel .cr-compounding.compounding { border-left-color: var(--green); }
  #controlRoomPanel .cr-compounding.compounding-manual { border-left-color: var(--amber); }
  #controlRoomPanel .cr-compounding.stalled { border-left-color: var(--red); background: var(--red-bg); }
  #controlRoomPanel .cr-compounding.idle { border-left-color: var(--border); }
  #controlRoomPanel .cr-comp-badge { font-weight: 800; font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; }
  #controlRoomPanel .cr-compounding.compounding .cr-comp-badge { color: var(--green); }
  #controlRoomPanel .cr-compounding.compounding-manual .cr-comp-badge { color: var(--amber); }
  #controlRoomPanel .cr-compounding.stalled .cr-comp-badge { color: var(--red); }
  #controlRoomPanel .cr-compounding.idle .cr-comp-badge { color: var(--cr-label); }
  #controlRoomPanel .cr-comp-detail { color: var(--cr-amber); font-variant-numeric: tabular-nums; }
  .cr-projects { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cr-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 10px; font-size: 12px; letter-spacing: 0.5px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.06);
  }
  /* indicator lamp — solid ink dot with a soft tint halo (daylight version
     of the backlit lamp; the halo carries the "lit" reading) */
  .cr-chip-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    background: #cfd6e2;
    box-shadow: inset 0 0 0 1px rgba(28,36,51,0.18);
  }
  .cr-chip-dot.healthy {
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-bg);
  }
  .cr-chip-dot.degraded {
    background: var(--yellow);
    box-shadow: 0 0 0 3px var(--yellow-bg);
  }
  .cr-chip-dot.down {
    background: var(--red);
    box-shadow: 0 0 0 3px var(--red-bg);
    animation: cr-alarm 1.4s ease-in-out infinite;
  }
  .cr-chip-dot.idle {
    background: #cfd6e2;
    box-shadow: inset 0 0 0 1px rgba(28,36,51,0.18);
  }
  @keyframes cr-alarm { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
  @media (prefers-reduced-motion: reduce) { .cr-chip-dot.down { animation: none; } }
  .cr-chip-state { color: var(--cr-label); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
  /* relay STAGE on the chip -- green phosphor (SYSTEM-MAP s2 baton) */
  .cr-chip-stage {
    color: var(--green);
    font-weight: 700; letter-spacing: 0.5px; font-size: 11px;
    padding: 1px 6px; border-radius: 3px; background: var(--green-bg);
  }
  /* annunciator / telemetry strip */
  .cr-feed {
    background: var(--cr-steel-2); border-radius: 4px; padding: 4px 12px;
    box-shadow: inset 0 1px 3px rgba(16,24,40,0.08);
  }
  .cr-feed-row {
    display: flex; gap: 10px; padding: 5px 0; align-items: baseline;
    border-bottom: 1px solid rgba(28,36,51,0.07); font-size: 13px;
  }
  .cr-feed-row:last-child { border-bottom: none; }
  .cr-feed-time { color: var(--cr-label); font-size: 12px; flex-shrink: 0; min-width: 58px; }
  .cr-feed-machine { color: var(--cyan); font-size: 12px; flex-shrink: 0; min-width: 64px; }
  .cr-feed-line { color: var(--text); word-break: break-word; }
  .cr-feed-row.ok .cr-feed-line { color: var(--green); }
  .cr-feed-row.bad .cr-feed-line { color: var(--red); }
  .cr-feed-row.warn .cr-feed-line { color: var(--yellow); }
  /* Construction timeline + flagship spotlight (ASCII-only labels) */
  #controlRoomPanel .cr-subhead { color: var(--cr-amber); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 6px; }
  #controlRoomPanel .cr-spotlight { border: 1px solid rgba(122,82,0,0.35); border-radius: 5px; padding: 8px 10px; margin-bottom: 10px; background: var(--surface); }
  #controlRoomPanel .cr-spotlight-title { color: var(--cr-amber); font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  #controlRoomPanel .cr-spotlight-count { font-size: 12px; font-weight: 600; color: var(--green); letter-spacing: 0.5px; margin-left: 6px; }
  #controlRoomPanel .cr-thumb { display: block; width: 100%; max-width: 360px; height: auto; border: 1px solid rgba(122,82,0,0.3); border-radius: 4px; margin: 0 0 8px; }
  #controlRoomPanel .cr-roadmap { margin: 0 0 8px; }
  #controlRoomPanel .cr-roadmap-label { color: var(--cr-label); font-size: 12px; letter-spacing: 0.5px; margin-bottom: 3px; }
  #controlRoomPanel .cr-roadmap-bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  #controlRoomPanel .cr-roadmap-fill { height: 100%; background: var(--green); }
  #controlRoomPanel .cr-timeline-slug { display: inline-block; min-width: 64px; color: var(--cr-label); font-size: 12px; letter-spacing: 0.5px; margin-right: 6px; }
  #controlRoomPanel .cr-timeline-task { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green); border: 1px solid rgba(26,127,55,0.4); border-radius: 3px; padding: 0 4px; margin-right: 6px; background: var(--green-bg); }
  #controlRoomPanel .cr-timeline-task.task-feat,
  #controlRoomPanel .cr-timeline-task.task-feature,
  #controlRoomPanel .cr-timeline-task.task-scaffold-app { color: var(--green); border-color: rgba(26,127,55,0.4); background: var(--green-bg); }
  #controlRoomPanel .cr-timeline-task.task-fix,
  #controlRoomPanel .cr-timeline-task.task-fix-attempt { color: var(--red); border-color: rgba(179,38,30,0.4); background: var(--red-bg); }
  #controlRoomPanel .cr-timeline-task.task-docs,
  #controlRoomPanel .cr-timeline-task.task-docs-gen,
  #controlRoomPanel .cr-timeline-task.task-audit { color: var(--yellow); border-color: rgba(154,103,0,0.4); background: var(--yellow-bg); }
  #controlRoomPanel .cr-timeline-task.task-test { color: var(--cyan); border-color: rgba(14,116,144,0.4); background: #e3f3f7; }
  #controlRoomPanel .cr-timeline-task.task-chore,
  #controlRoomPanel .cr-timeline-task.task-refactor,
  #controlRoomPanel .cr-timeline-task.task-wip { color: var(--text-dim); border-color: rgba(85,97,121,0.4); background: var(--surface2); }
  #controlRoomPanel .cr-timeline-sha { color: var(--cr-label); font-size: 12px; margin-left: 6px; opacity: 0.8; }
  #controlRoomPanel .cr-filter { display: flex; gap: 6px; margin: 8px 0 6px; }
  #controlRoomPanel .cr-filter button {
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--cr-label); background: var(--cr-steel-2); border: 1px solid var(--border);
    border-radius: 3px; padding: 3px 10px; cursor: pointer;
  }
  #controlRoomPanel .cr-filter button:hover { color: var(--cr-amber); border-color: rgba(122,82,0,0.45); }
  #controlRoomPanel .cr-filter button.active { color: #ffffff; background: var(--cr-amber); border-color: var(--cr-amber); }
  #controlRoomPanel a.cr-timeline-link { color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(28,36,51,0.3); }
  #controlRoomPanel a.cr-timeline-link:hover { border-bottom-color: var(--green); }
  #controlRoomPanel .cr-trust-row { display: flex; gap: 10px; padding: 5px 0; align-items: baseline; font-size: 13px; border-bottom: 1px solid rgba(28,36,51,0.07); }
  #controlRoomPanel .cr-trust-row:last-child { border-bottom: none; }
  #controlRoomPanel .cr-revert-kind { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border-radius: 3px; padding: 0 4px; margin-right: 6px; border: 1px solid; }
  #controlRoomPanel .cr-revert-kind.auto { color: var(--green); border-color: rgba(26,127,55,0.4); }
  #controlRoomPanel .cr-revert-kind.manual { color: var(--cr-amber); border-color: rgba(122,82,0,0.45); }
  #controlRoomPanel .cr-quality-trend { font-size: 12px; font-weight: 700; margin: 0 6px; }
  #controlRoomPanel .cr-quality-trend.up { color: var(--red); }
  #controlRoomPanel .cr-quality-trend.down { color: var(--green); }
  #controlRoomPanel .cr-quality-trend.flat { color: var(--cr-label); }
  #controlRoomPanel .cr-quality-flag { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--red); border: 1px solid rgba(179,38,30,0.5); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
  #controlRoomPanel .cr-timeline-diff { font-family: monospace; font-size: 12px; margin-left: 6px; color: var(--cr-label); opacity: 0.85; }

  /* === Step 2 redesign panels === */

  /* Status dot — replaces the platform-rendered emoji set
     (🟢⚪🟡⚫🔴) used in the banner, what's-happening table,
     rotation verdict, and attention rows. Theme-matched to the Tokyo Night
     palette so the dashboard reads consistently across iOS Safari, Windows
     Chrome, and Android (where the same emoji codepoint renders three
     different ways). Idle is the only hollow variant — mirrors the original
     ⚪ "no work yet" semantic; the others are solid fills differentiated
     by color. */
  .status-dot {
    display: inline-block; flex-shrink: 0;
    width: 10px; height: 10px; border-radius: 50%;
    vertical-align: middle;
  }
  .status-dot.lg { width: 14px; height: 14px; }
  .status-dot.running { background: var(--green); }
  .status-dot.idle    { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-dim); }
  .status-dot.waiting { background: var(--yellow); }
  .status-dot.asleep  { background: var(--text-dim); }
  .status-dot.broken  { background: var(--red); }

  /* Pixel-art PC icon — vintage 1990s beige desktop, hand-drawn SVG with
     crisp-edges rendering. The .pc-led pixel is the only piece that recolors
     by machine state; everything else is static. Sized at 28px to read at
     dashboard zoom while keeping the What's-Happening rows compact. */
  .pc-icon {
    width: 32px; height: 32px;
    flex-shrink: 0; display: block;
    image-rendering: pixelated;
  }
  /* Screen + LED both recolor by state. The screen is the dominant
     indicator (large, visible at a glance); the LED is a smaller secondary
     signal. Colors evoke vintage CRT phosphors: green for running, amber
     for waiting/skipped, red for broken, near-black for asleep. */
  .pc-icon .pc-screen { fill: #1a2c34; }
  .pc-icon .pc-led    { fill: var(--text-dim); }

  .pc-icon.running .pc-screen { fill: #144826; }
  .pc-icon.running .pc-led    {
    fill: var(--green);
    filter: drop-shadow(0 0 1.2px var(--green));
  }

  .pc-icon.waiting .pc-screen { fill: #4a3a14; }
  .pc-icon.waiting .pc-led    {
    fill: var(--yellow);
    filter: drop-shadow(0 0 1.2px var(--yellow));
  }

  .pc-icon.broken  .pc-screen { fill: #4a1818; }
  .pc-icon.broken  .pc-led    {
    fill: var(--red);
    filter: drop-shadow(0 0 1.2px var(--red));
  }

  .pc-icon.asleep  .pc-screen { fill: #0c0c0c; }
  .pc-icon.asleep  .pc-led    { fill: #4a4a4a; }

  .pc-icon.idle    .pc-screen { fill: #1a2c34; }
  .pc-icon.idle    .pc-led    { fill: var(--text-dim); }

  /* Banner v2 — operator-facing one-sentence health summary. Replaces the
     legacy uppercase-state-+-reason-code banner with plain English. */
  .banner-v2 {
    display: flex; align-items: center;
    padding: 14px 16px; border-radius: 8px; margin-bottom: 14px;
    font-size: 15px; line-height: 1.4;
  }
  .banner-v2 > *:not(:last-child) { margin-right: 12px; }
  .banner-v2.ok      { background: var(--green-bg); border: 1px solid var(--green);  color: var(--green); }
  .banner-v2.warn    { background: var(--yellow-bg); border: 1px solid var(--yellow); color: var(--yellow); }
  .banner-v2.err     { background: var(--red-bg); border: 1px solid var(--red);    color: var(--red); }
  .banner-v2.neutral { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }
  .banner-v2 .banner-text { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
  .banner-v2 .banner-detail {
    font-size: 13px; font-weight: 400; color: var(--text-dim);
    margin-top: 4px; word-break: break-word;
  }

  /* Generic top section panel — used by what's-happening, today's work,
     rotation, and attention. Visually similar to .auto-digest / .expected-fleet
     but with a slightly stronger header so the new sections read as the
     primary surface. */
  .top-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
    font-size: 13px;
  }
  .ts-header {
    font-size: 12px; font-weight: 600; color: var(--cyan);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* What's happening — one row per machine. */
  .wh-row {
    display: flex; align-items: flex-start; flex-wrap: wrap;
    padding: 5px 0; font-size: 13px;
    border-top: 1px solid rgba(28,36,51,0.08);
  }
  .wh-row:first-of-type { border-top: none; }
  .wh-row > .wh-name, .wh-row > .wh-icon, .wh-row > .wh-sentence { margin-right: 10px; }
  .wh-name { color: var(--text); font-weight: 600; min-width: 100px; flex-shrink: 0; }
  .wh-icon { flex-shrink: 0; padding-top: 3px; }
  .wh-sentence { color: var(--text-dim); flex: 1; min-width: 0; word-break: break-word; line-height: 1.3; }
  .wh-sentence.broken { color: var(--red); }
  .wh-sentence.waiting { color: var(--yellow); }
  .wh-sentence.running { color: var(--green); }
  /* Kimi gate chip — drops to its own line under the sentence at the
     dashboard's 600px max-width; left-padded to align with where the
     sentence starts (name 100px + 10px gap). */
  /* Kimi gate chip — aligns under the sentence at the dashboard's normal
     width (name 100px + 10px gap = 110px left indent). On <400px viewports
     the indent would crowd the chip against the right edge, so we drop the
     padding and let it sit flush. Removed white-space:nowrap so longer
     gate strings wrap instead of overflowing the row. */
  .wh-kimi { flex-basis: 100%; padding-left: 110px; padding-top: 2px; font-variant-numeric: tabular-nums; word-break: break-word; }
  @media (max-width: 399px) {
    .wh-kimi { padding-left: 0; }
  }
  .wh-kimi.green { color: var(--green); }
  .wh-kimi.red { color: var(--red); }
  .wh-kimi.unknown { color: var(--text-dim); }
  .wh-quota { flex-basis: 100%; padding-left: 110px; padding-top: 2px; font-variant-numeric: tabular-nums; word-break: break-word; }
  @media (max-width: 399px) {
    .wh-quota { padding-left: 0; }
  }
  .wh-quota.green { color: var(--green); }
  .wh-quota.yellow { color: var(--yellow); }
  .wh-quota.orange { color: var(--amber); }
  .wh-quota.red { color: var(--red); }
  .wh-quota.unknown { color: var(--text-dim); }

  /* Today's work — 3-row mini-table. */
  .tw-row {
    display: flex; align-items: center;
    padding: 4px 0; font-size: 13px;
  }
  .tw-row > *:not(:last-child) { margin-right: 10px; }
  .tw-row .tw-label { color: var(--text-dim); min-width: 130px; flex-shrink: 0; }
  .tw-row .tw-value { color: var(--text); flex: 1; word-break: break-word; }
  .tw-row .tw-value.accent { color: var(--accent); }
  .tw-bar {
    flex: 1; height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden; min-width: 60px;
    margin-right: 8px;
  }
  .tw-bar-fill { height: 100%; background: var(--green); }
  @media (prefers-reduced-motion: no-preference) {
    .tw-bar-fill { transition: width 0.3s ease; }
  }
  .tw-bar-fill.yellow { background: var(--yellow); }
  .tw-bar-fill.red { background: var(--red); }
  .tw-pr-link {
    display: inline-block; font-size: 12px; padding: 1px 6px;

  /* Rotation panel. */

    font-size: 13px; font-weight: 600; margin-top: 4px;

  .rot-verdict.ok    { color: var(--green); }

  /* Attention panel. */

  .pending-merges { margin-bottom: 14px; }

  .pm-suspend-callout {
    margin-top: 6px; padding: 6px 8px;

  }
  .pm-entry details { margin-top: 6px; }

  .pm-entry summary::-webkit-details-marker { display: none; }
  .pm-entry summary::before {

  .pm-entry details[open] summary::before { content: '\25BE'; }
  .pm-tail-label {
    font-size: 12px; color: var(--text-dim);
    margin-top: 6px; margin-bottom: 2px;
  }
  .pm-entry pre {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px;
    font-family: inherit; font-size: 12px; color: var(--text);

  .refresh-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--text-dim); margin-bottom: 14px;

  .refresh-btn {
    background: var(--surface); border: 1px solid var(--border);

    padding: 4px 10px; cursor: pointer; font-family: inherit;
  }
  .refresh-btn:active { background: var(--surface2); }

  /* Keyboard-nav focus indicators. Every clickable element on the
     dashboard — disclosure summaries (machine cards, diag drawer, PR
     entries), buttons, and footer links — was missing :focus-visible
     styling, so a Tab-driven walk through the page rendered no visible
     cursor. Single rule covers all of them; -offset:2 prevents the
     outline from clipping the rounded panel edges. */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }
  summary:focus-visible { outline-offset: -2px; border-radius: 6px; }

  .install-btn {
    background: var(--accent); border: none; border-radius: 6px;
    color: #ffffff; font-size: 13px; font-weight: 600;
    padding: 6px 14px; cursor: pointer; font-family: inherit;
    display: none;
  }
  .install-btn:active { opacity: 0.8; }

  .error-box {
    background: var(--red-bg); border: 1px solid var(--red);
    border-radius: 6px; padding: 12px; font-size: 13px; color: var(--red);
    margin-bottom: 14px; display: none;
    word-break: break-word;
  }
  .error-box small { display: block; margin-top: 4px; color: var(--text-dim); font-size: 12px; }
  .footer { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 20px; }
  .footer a { color: var(--accent); text-decoration: none; }

    display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px;
  }
  #modelTierPanel .mt-rung {
    display: flex; align-items: center; gap: 6px;

  .pm-table-wrap { padding-top: 8px; }

  .pm-table { width: 100%; border-collapse: collapse; font-size: 13px; }

  .cr-feed-more[open] > summary::before { content: '\25BE'; }
  .cr-feed-count {
    display: inline-block; font-size: 11px; padding: 0 4px;
    border-radius: 3px; font-weight: 600;
    background: var(--surface2); color: var(--text-dim);
    margin-left: 4px;
  }
</style>
</head>
<body>

<h1>Dispatcher Fleet</h1>
<div class="subtitle">Budget-aware autonomous dispatch across machines</div>

<div class="refresh-bar">
  <span id="lastRefresh" aria-live="polite" aria-atomic="true">Loading...</span>
  <span>
    <button class="install-btn" id="installBtn" onclick="installPWA()" aria-label="Install dashboard as app">Install App</button>
    <button class="refresh-btn" onclick="refresh()" aria-label="Refresh dashboard data">Refresh</button>
  </span>
</div>

<div class="error-box" id="errorBox"></div>
<!-- Top-of-page operator surfaces (Step 2 redesign). Order is the load-bearing
     part: banner → what's happening → today's work → rotation → attention.
     The legacy expectedFleet / autoDigest / pendingMerges panels are kept
     below as detail-level companions per PLAN-dashboard-redesign.md §rollout
     step 4. -->
<div id="healthBanner"></div>
<div id="modelTierPanel" class="top-section" style="display:none"></div>
<div id="recentSubstitutionsPanel" class="top-section" style="display:none"></div>
<div id="whatsHappening" class="top-section" style="display:none"></div>
<div id="todaysWork" class="top-section" style="display:none"></div>
<div id="shippedPanel" class="top-section" style="display:none"></div>
<div id="rotationPanel" class="top-section" style="display:none"></div>
<div id="attentionPanel" class="top-section" style="display:none"></div>
<div id="errorContextPanel" class="top-section" style="display:none"></div>
<div id="expectedFleet" class="expected-fleet" style="display:none"></div>
<div id="autoDigestPanel" class="auto-digest" style="display:none"></div>
<div id="stuckPatternsPanel" class="auto-digest" style="display:none"></div>
<div id="testCountsPanel" class="auto-digest" style="display:none"></div>
<div id="pendingMerges" class="pending-merges"></div>
<div id="controlRoomPanel" class="auto-digest" style="display:none"></div>
<div id="machines"></div>

<div class="footer">
  <a href="https://gist.github.com/pmartin1915/655d02ce43b293cacdf333a301b63bbf" target="_blank" rel="noopener noreferrer">Raw gist data</a>
</div>

<script>
const GIST_ID = '655d02ce43b293cacdf333a301b63bbf';
const GIST_URL = `https://api.github.com/gists/${GIST_ID}`;
const STALE_HOURS = 4;

// Friendly display names for each machine. Keys are the lowercase hostnames
// that appear in fleet-<hostname>.json. Seed/fallback only — the real source
// of truth is config/shared.json:expected_machines, surfaced through
// fleet-membership.json's verdict entries by refreshMachineNames(gist) on
// every render. Keys here drive display order until/unless a gist-sourced
// machine appears that isn't seeded here (those get appended).
const MACHINE_NAMES_FALLBACK = {
  'desktop-p7h5aj1': 'Downstairs PC',
  'desktop-tojgbg2': 'Upstairs PC',
  'perrypc':         'Main PC',
  'perryslenovo':    'Laptop',
};
let MACHINE_NAMES = { ...MACHINE_NAMES_FALLBACK };

// Track last successful refresh so we can show staleness when a refresh fails.
let lastSuccessTs = null;

// Construction timeline filter state (global feed only; spotlights unfiltered).
let crTimelineFilter = 'all';
let crTimelineData = null;

// === Helpers ===

function esc(s) {
  // HTML-escape for innerHTML interpolation. Defense-in-depth on gist-sourced data.
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function present(v) {
  return v != null && v !== '';
}

function safe(v, fallback) {
  return v == null || v === '' ? (fallback === undefined ? '—' : fallback) : v;
}

function formatDuration(ms) {
  if (ms < 0) return 'just now';
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ${mins % 60}m ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ${hrs % 24}h ago`;
}

function formatDurationShort(ms) {
  if (ms < 60000) return '<1m';
  const mins = Math.floor(ms / 60000);
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ${mins % 60}m`;
  const days = Math.floor(hrs / 24);
  return `${days}d ${hrs % 24}h`;
}

function ago(ts) {
  if (!ts) return 'never';
  return formatDuration(Date.now() - new Date(ts).getTime());
}

function agoMs(tsMs) {
  if (!tsMs) return 'never';
  return formatDuration(Date.now() - tsMs);
}

function untilMs(tsMs) {
  if (!tsMs) return null;
  const ms = tsMs - Date.now();
  if (ms < 0) return `overdue ${formatDurationShort(-ms)}`;
  return `T+${formatDurationShort(ms)}`;
}

function isoLocal(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleString(); }
  catch { return String(ts); }
}

function parseFile(gist, name) {
  try { return JSON.parse(gist.files[name]?.content ?? '{}'); }
  catch { return {}; }
}

// === Refresh + status-aware error handling ===

async function refresh() {
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  errorBox.innerHTML = '';
  try {
    const res = await fetch(GIST_URL, { cache: 'no-store' });
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      err.statusText = res.statusText;
      const retryAfter = res.headers.get('retry-after');
      const reset = res.headers.get('x-ratelimit-reset');
      if (retryAfter) err.retryAfter = parseInt(retryAfter, 10);
      else if (reset) {
        const seconds = parseInt(reset, 10) - Math.floor(Date.now() / 1000);
        if (seconds > 0) err.retryAfter = seconds;
      }
      throw err;
    }
    const gist = await res.json();
    render(gist);
    lastSuccessTs = Date.now();
    document.getElementById('lastRefresh').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    showRefreshError(errorBox, e);
  }
}

function showRefreshError(errorBox, e) {
  let detail;
  if (e.status === 403) {
    detail = 'HTTP 403 Forbidden — check gist visibility / token scope';
  } else if (e.status === 404) {
    detail = 'HTTP 404 Not Found — verify gist ID';
  } else if (e.status === 429) {
    detail = 'HTTP 429 Too Many Requests — rate limited';
    if (e.retryAfter) detail += `; retry after ${e.retryAfter}s`;
  } else if (e.status >= 500) {
    detail = `HTTP ${e.status}${e.statusText ? ' ' + e.statusText : ''} — GitHub API issue, retry shortly`;
  } else if (e.status) {
    detail = `HTTP ${e.status}${e.statusText ? ' ' + e.statusText : ''}`;
  } else {
    detail = `Network error: ${e.message || 'unknown'}`;
  }
  // Build via DOM (textContent) to avoid injection from exception messages.
  errorBox.innerHTML = '';
  const strong = document.createElement('strong');
  strong.textContent = 'Refresh failed';
  errorBox.appendChild(strong);
  errorBox.appendChild(document.createElement('br'));
  errorBox.appendChild(document.createTextNode(detail));
  if (lastSuccessTs) {
    const small = document.createElement('small');
    small.textContent = `Last success: ${agoMs(lastSuccessTs)}`;
    errorBox.appendChild(small);
  }
  errorBox.style.display = 'block';
}

// === Phase-specific error hints ===

function errorHint(reason, detail) {
  if (!present(reason)) return null;
  const r = String(reason);
  const combined = (r + ' ' + (detail || '')).toLowerCase();
  if (combined.includes('quota_exhausted')) {
    return 'Gemini daily quota hit. Will retry after free-tier reset.';
  }
  if (r === 'selector-failed') return 'Check GEMINI_API_KEY env / quota status.';
  if (r === 'all-projects-saturated') return 'Not a provider issue -- queues are full. Check whether PRs are merging/closing to drain the backlog.';
  if (r === 'worker-failed') return 'Worker phase. See "Phase" in Diagnostics for the gate.';
  if (r === 'verify-commit-failed') return 'Tests or typecheck failed in the project worktree.';
  if (r === 'gist-write-failed') return 'Status gist write failed. Check GIST_AUTH_TOKEN scope.';
  if (r === 'dispatch-locked') return 'Another machine is dispatching. Self-resolves in <15min.';
  return null;
}

// MIRRORS scripts/lib/control-room.mjs displayPrTitle (this file is
// self-contained and cannot import server modules) - keep in sync.
function displayPrTitle(title) {
  const raw = typeof title === 'string' ? title.trim() : '';
  if (!raw) return { task: null, text: '' };
  const m = raw.match(/^\[dispatcher\]\s+([a-z-]+):\s*(.*)$/i);
  if (!m || !m[2]) return { task: null, text: raw };
  return { task: m[1].toLowerCase(), text: m[2] };
}

// reasonToSentence — translate a dispatcher skip-reason code into operator
// copy. Codes are emitted by scripts/lib/gates.mjs and scripts/dispatch.mjs;
// this is the single mapping table that turns them into plain English on
// the dashboard. Returns null for unknown codes so callers can fall back
// to rendering the raw code. The fleet param is unused in v1 but reserved
// for future enrichment (e.g. derived sentences from estimator state).
function reasonToSentence(reason, _fleet) {
  if (!present(reason)) return null;
  switch (reason) {
    case 'quota_exhausted':
      return 'Free-model quota exhausted - waiting for the window to reset.';
    case 'canary-failed':
      return 'Pre-flight canary probe failed - dispatch held.';
    case 'selector-fallback':
      return 'Primary pick failed; ran the fallback selector.';
    case 'selector-failed':
      return "Couldn't pick a task. Selector returned nothing.";
    case 'all-projects-saturated':
      return 'Queues are full -- waiting for PRs to drain, not stuck.';
    case 'daily-quota-reached':
      return 'Done for the day. Resets at UTC midnight.';
    case 'user-active':
      return 'User active recently. Quiet until next idle window.';
    case 'paused-config':
      return 'Paused via config. Re-enable in budget.json.';
    case 'paused-sentinel':
      return 'Sentinel paused dispatch (likely after repeated errors).';
    case 'estimator-error':
      return 'Budget estimator failed. Check canary logs.';
    case 'activity-gate-error':
      return 'Activity probe failed. Treating machine as in-use.';
    case 'dispatch-locked':
      return 'Another dispatch is already running on this machine.';
    case 'no-eligible-projects':
      return 'No project ready for an auto-task right now.';
    case 'insufficient-history-span':
      return 'Not enough commit history to estimate burn yet.';
    default:
      if (String(reason).toLowerCase().startsWith('circuit-broken')) {
        return 'Circuit breaker open after repeated errors - cooling down.';
      }
      const humanized = String(reason).replace(/[_-]+/g, ' ');
      return `Last cycle: ${humanized}.`;
  }
}

// Burn bar — visual gauge for percent-of-target metrics (weekly burn,
// daily quota fill). Returns a DOM fragment. Color tier matches the gate
// semantics: <=80% green, 80-100% yellow, >100% red.
function buildBurnBar(label, pct, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'burn-bar-wrap';
  const lbl = document.createElement('span');
  lbl.className = 'label';
  lbl.textContent = label;
  wrap.appendChild(lbl);

  const bar = document.createElement('div');
  bar.className = 'burn-bar';
  const fill = document.createElement('div');
  fill.className = 'burn-bar-fill';
  // Cap visual width at 100% but let the numeric label show the true value.
  // Negative values (rare; e.g. headroom_pct) clamp to 0.
  const clamped = Math.max(0, Math.min(100, Number(pct)));
  fill.style.width = `${clamped}%`;
  let tier;
  if (pct > 100) tier = 'red';
  else if (pct >= (opts.warnAt ?? 80)) tier = 'yellow';
  else tier = 'green';
  fill.classList.add(tier);
  bar.appendChild(fill);
  wrap.appendChild(bar);

  const pctLabel = document.createElement('span');
  pctLabel.className = `burn-pct ${tier}`;
  // Display with one decimal for sub-100 values so 72.9% doesn't read as 73%.
  // Above 100% drop the decimal — "144%" is more legible than "143.97%".
  pctLabel.textContent = pct >= 100 ? `${Math.round(pct)}%` : `${Number(pct).toFixed(1)}%`;
  wrap.appendChild(pctLabel);
  return wrap;
}

// Daily-quota counter as a non-bar row (text-only; the cap can be 30+ so a
// 0-100 bar misrepresents the scale).
function buildQuotaRow(used, cap) {
  const row = document.createElement('div');
  row.className = 'row';
  const lbl = document.createElement('span');
  lbl.className = 'label';
  lbl.textContent = 'Daily quota';
  const val = document.createElement('span');
  val.className = 'value';
  if (present(cap) && cap > 0) {
    const ratio = used / cap;
    val.textContent = `${used}/${cap}`;
    if (ratio >= 1) val.classList.add('warn');
    else val.classList.add('accent');
  } else {
    val.textContent = String(used);
    val.classList.add('accent');
  }
  row.appendChild(lbl);
  row.appendChild(val);
  return row;
}

// Fleet-aggregate "last successful dispatch" — handles per-host health.json
// underreporting (last writer wins on the gist when multiple hosts compute
// from their own logs).
//
// MIRRORS scripts/lib/fleet.mjs:aggregateLastDispatch — keep in sync. The
// dashboard ships as static HTML to GitHub Pages with no build step, so the
// helper is duplicated rather than imported. Any logic change must land in
// both files. fleet.test.mjs covers the mjs side; manual smoke against the
// live gist covers the dashboard side.
function aggregateLastDispatch(fleetSnaps) {
  let bestTs = null, bestMachine = null, bestMs = -Infinity;
  for (const snap of fleetSnaps || []) {
    const ts = snap?.last_dispatch_ts;
    if (typeof ts !== 'string') continue;
    const ms = new Date(ts).getTime();
    if (!Number.isFinite(ms)) continue;
    if (ms > bestMs) { bestMs = ms; bestTs = ts; bestMachine = snap?.machine ?? null; }
  }
  return { ts: bestTs, machine: bestMachine };
}

// === Machine state + tags ===

function machineState(fleet) {
  if (!fleet.last_run_ts) return 'stale';
  const hrs = (Date.now() - new Date(fleet.last_run_ts).getTime()) / 3600000;
  if (fleet.consecutive_errors >= 3) return 'err';
  if (hrs > STALE_HOURS) return 'stale';
  if (fleet.last_run_outcome === 'skipped' && fleet.last_error_reason) return 'warn';
  return 'ok';
}

function outcomeTag(outcome) {
  if (!outcome) return '<span class="tag dim">none</span>';
  const cls = outcome === 'success' ? 'ok' : outcome === 'skipped' ? 'dim' : 'err';
  return `<span class="tag ${cls}">${esc(outcome)}</span>`;
}

// === Stage taxonomy (Step 2 redesign) ===
//
// MIRRORS scripts/lib/stage-constants.mjs — keep in sync. The dashboard ships
// as static HTML to GitHub Pages with no build step, so the helper is
// duplicated rather than imported. Same pattern as aggregateLastDispatch
// above. The Node-side regression test in scripts/lib/__tests__/stage-
// constants.test.mjs guards the source-of-truth mjs file against drift from
// dispatch.mjs's emitted phases; this dashboard copy is NOT covered by that
// test and must be updated by hand whenever STAGES, PHASE_RANGES, or
// META_PHASES change in the .mjs file.
const STAGE_LABELS = [
  { num: 1, label: 'Pre-flight' },
  { num: 2, label: 'Select' },
  { num: 3, label: 'Route' },
  { num: 4, label: 'Worktree' },
  { num: 5, label: 'Work' },
  { num: 6, label: 'Verify' },
  { num: 7, label: 'Commit' },
  { num: 8, label: 'Push' },
  { num: 9, label: 'Merge' },
];
const PHASE_RANGES_DASHBOARD = {
  'canary':            [1, 1],
  'drift-check':       [1, 1],
  'gate':              [1, 1],
  'selector':          [2, 2],
  'router':            [3, 3],
  'pipeline':          [4, 8],
  'auto-push':         [8, 8],
  'post-merge-canary': [9, 9],
};

// Convert an internal phase string to a stage descriptor. Returns null for
// meta phases (complete, fatal, lock, etc.) and for unknown input.
function phaseToStage(phase) {
  if (!present(phase)) return null;
  const range = PHASE_RANGES_DASHBOARD[phase];
  if (!range) return null;
  const [from, to] = range;
  if (from === to) {
    const stage = STAGE_LABELS[from - 1];
    return { num: stage.num, label: stage.label, isRange: false };
  }
  return {
    num: null,
    label: `${STAGE_LABELS[from - 1].label} → ${STAGE_LABELS[to - 1].label}`,
    isRange: true,
  };
}

// === Machine status (Step 2 redesign) ===
//
// Five operator-facing states for the "What's happening right now" mini-table.
// These are coarser than machineState() (which is the existing dot-color
// computation feeding the per-machine cards) — they collapse warn/idle/stale
// into the more readable {running, idle, waiting, asleep, broken} taxonomy.
//
// Causality: the order of checks matters. Errors and total-stale beat
// everything; user-active beats successful-but-recent because it's the
// expected reason a machine is quiet.
// Outcome buckets — mirror scripts/lib/outcomes.mjs literal values. Pre-2026-05-20
// this function only checked the literal 'success' string, but the dispatcher
// emits 'wrapper-success' / 'auto-push-success' on healthy completion and
// 'local-task-failed' / 'reverted' / 'auto-push-blocked' / 'canary-failed' /
// 'scan-revert' / 'auto-push-failed' on troubled-but-not-broken cycles. Result
// was that the status function collapsed every machine to 'idle' on most days
// and the dashboard's status-dot / pixel PC LED never colored.
const HEALTHY_OUTCOMES = new Set([
  'success', 'wrapper-success', 'auto-push-success',
  // 'no-changes' = verify-commit found nothing to commit (worker ran clean).
  // 'auto-recovered' = dispatch.mjs recovered from a transient failure.
  // Both are healthy completions, just without a commit to push.
  'no-changes', 'auto-recovered',
  // 'health-check-pass' = BudgetDispatcher-Health 2h cron ran the per-project
  // vitest+typecheck pulse and everything passed. Real signal, not a no-op.
  'health-check-pass',
]);
const TROUBLED_OUTCOMES = new Set([
  'local-task-failed', 'reverted', 'auto-push-blocked', 'auto-push-failed',
  'canary-failed', 'scan-revert', 'audit-truncated', 'audit-thin',
  'pipeline-aborted',
  // Worker-class troubled outcomes added 2026-05-21 to match outcomes.mjs.
  // 'auto-disabled' = project force-disabled (circuit breaker / opt-out).
  // 'drift-alert' = drift detector tripped.
  // 'local-env-broken' = env broke mid-cycle.
  // 'scaffold-missing' / 'scaffold-check-error' = scaffold gate failed.
  // 'clinical-gate-revert' = sibling of 'scan-revert' / 'reverted'.
  // 'triage-parse-error' = LLM triage output unparseable.
  'auto-disabled', 'drift-alert', 'local-env-broken',
  'scaffold-missing', 'scaffold-check-error',
  'clinical-gate-revert', 'triage-parse-error',
  // 'health-check-fail' = per-project pulse matched a known sandbox signature
  // and wrote an alert. ('health-check-infrastructure' deliberately stays out
  // of both sets — see EXPECTED_UNCLASSIFIED in machine-status-coverage.test.)
  'health-check-fail',
]);

// Compounding-status rank for control-room banner and fleet banner. Worst wins.
const COMP_RANK = { stalled: 3, 'compounding-manual': 3, compounding: 2, idle: 1 };

// ---- BEGIN computeMachineStatus ----
function computeMachineStatus(fleet, nowMs = Date.now()) {
  const errors = Number(fleet?.consecutive_errors) || 0;
  const lastRunMs = fleet?.last_run_ts
    ? new Date(fleet.last_run_ts).getTime()
    : null;
  const ageHrs = lastRunMs && Number.isFinite(lastRunMs)
    ? (nowMs - lastRunMs) / 3600000
    : Infinity;

  if (errors >= 3 || ageHrs > 24) return 'broken';
  if (fleet?.last_run_reason === 'user-active') return 'asleep';
  if (ageHrs > STALE_HOURS) return 'asleep';
  if (fleet?.last_run_outcome === 'skipped') return 'waiting';
  if (TROUBLED_OUTCOMES.has(fleet?.last_run_outcome)) return 'waiting';
  // 20-min running window: matches the dispatcher's 20-min cron cadence so a
  // healthy machine stays "running" green through one full cycle gap instead
  // of flipping to idle teal halfway between cycles. Bumped from 10 min on
  // 2026-05-21 per operator feedback (all-green was unreachable at 10 min
  // because cron cycles are staggered and rarely land within the same window).
  if (HEALTHY_OUTCOMES.has(fleet?.last_run_outcome)) {
    return ageHrs * 60 < 20 ? 'running' : 'idle';
  }
  return 'idle';
}
// ---- END computeMachineStatus ----

// Build a status dot DOM node — replaces the platform-rendered emoji set
// (see .status-dot CSS comment). Falls back to 'idle' when the state is
// missing or unrecognized so the dashboard never renders a bare element.
function makeStatusDot(state, size) {
  const known = ['running', 'idle', 'waiting', 'asleep', 'broken'];
  const variant = known.includes(state) ? state : 'idle';
  const dot = document.createElement('span');
  dot.className = `status-dot ${variant}${size === 'lg' ? ' lg' : ''}`;
  return dot;
}

// 16-bit pixel-art PC icon. Vintage 1990s beige desktop, CRT on top, with a
// single LED pixel that recolors by machine state via the .pc-led CSS rules.
// Parsed once via DOMParser (HTML `innerHTML` would mishandle the SVG
// namespace) and cloned per call so each row gets an independent node we can
// add a state class to. Status states match makeStatusDot's vocabulary.
const PC_ICON_TEMPLATE = (() => {
  const svgStr =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" ' +
    'class="pc-icon" shape-rendering="crispEdges" aria-hidden="true" focusable="false">' +
      // ---- Monitor housing
      '<rect x="3" y="2" width="18" height="11" fill="#c8c0a8"/>' +
      '<rect x="3" y="2" width="18" height="1" fill="#dcd4be"/>' +  // top highlight
      '<rect x="3" y="2" width="1" height="11" fill="#dcd4be"/>' +  // left highlight
      '<rect x="20" y="2" width="1" height="11" fill="#9c9070"/>' + // right shadow
      '<rect x="3" y="12" width="18" height="1" fill="#9c9070"/>' + // bottom shadow
      // ---- Screen (recolors by state via .pc-screen class)
      '<rect class="pc-screen" x="5" y="4" width="14" height="7"/>' +
      // Translucent bevels so the highlight tone follows whatever screen color
      // is set per state (white overlay = lighter shade, black overlay = darker).
      '<rect x="5" y="4" width="14" height="1" fill="#ffffff" fill-opacity="0.18"/>' +  // top
      '<rect x="5" y="4" width="1"  height="7" fill="#ffffff" fill-opacity="0.18"/>' +  // left
      '<rect x="5" y="10" width="14" height="1" fill="#000000" fill-opacity="0.30"/>' + // bottom shadow
      '<rect x="18" y="4" width="1"  height="7" fill="#000000" fill-opacity="0.30"/>' + // right shadow
      // Monochrome "window" on the screen — translucent white so it reads on
      // any screen color (green/amber/red phosphor + dark idle).
      '<rect x="13" y="6" width="4" height="3" fill="#ffffff" fill-opacity="0.85"/>' +
      '<rect x="13" y="6" width="4" height="1" fill="#000000" fill-opacity="0.35"/>' +
      '<rect x="14" y="7" width="2" height="1" fill="#000000" fill-opacity="0.25"/>' +
      // ---- Desktop case
      '<rect x="1" y="13" width="22" height="6" fill="#d4c8a8"/>' +
      '<rect x="1" y="13" width="22" height="1" fill="#e6dbc0"/>' + // top highlight
      '<rect x="1" y="13" width="1"  height="6" fill="#e6dbc0"/>' + // left highlight
      '<rect x="22" y="13" width="1" height="6" fill="#9c9070"/>' + // right shadow

function makePcIcon(state) {
  const known = ['running', 'idle', 'waiting', 'asleep', 'broken'];
  const variant = known.includes(state) ? state : 'idle';
  const svg = PC_ICON_TEMPLATE.cloneNode(true);
  svg.classList.add(variant);
  return svg;
}

// Compose the plain-English sentence shown after each machine name in the
// "what's happening right now" mini-table. The status param is the value
// returned by computeMachineStatus().
function whatsHappeningSentence(fleet, status) {
  const reason = fleet?.last_run_reason;
  const lastRun = present(fleet?.last_run_ts) ? ago(fleet.last_run_ts) : null;

  if (status === 'broken') {
    const errs = Number(fleet?.consecutive_errors) || 0;
    const phase = phaseToStage(fleet?.last_error_phase);
    if (errs >= 3 && phase) {
      return `Errored ${errs}× in a row — last failure at stage ${phase.num ?? phase.label} (${phase.label}).`;
    }
    if (errs >= 3) {
      return `Errored ${errs} cycles in a row. Diagnostics drawer below has the message.`;
    }
    return lastRun
      ? `No heartbeat for ${lastRun.replace(' ago', '')}. Machine probably offline.`
      : 'No heartbeat ever. Machine has not checked in.';
  }
  if (status === 'asleep') {
    if (reason === 'user-active') {
      return 'User active recently. Quiet until next idle window.';
    }
    return lastRun
      ? `Last heartbeat ${lastRun}. Probably asleep or scheduled task off.`
      : 'No recent heartbeat.';
  }
  if (status === 'waiting') {
    const sentence = reasonToSentence(reason, fleet);
    if (sentence) return `Skipped: ${sentence.charAt(0).toLowerCase()}${sentence.slice(1)}`;
    return present(reason) ? `Skipped: ${reason}.` : 'Skipped this cycle.';
  }
  if (status === 'running') {
    return lastRun
      ? `Last cycle ${lastRun} — pushed.`
      : 'Just shipped a commit.';
  }
  // idle
  return lastRun
    ? `Last cycle ${lastRun}. Idle until next window.`
    : 'Idle.';
}

// === Diagnostics drawer (DOM-built; uses textContent for gist-sourced data) ===

function buildDiagDrawer(fleet) {
  // Mount only when at least one error/diagnostic field is present.
  const hasError = present(fleet?.last_error_reason) || present(fleet?.last_error_phase);
  if (!hasError) return null;

  const details = document.createElement('details');
  details.className = 'diag-drawer';

  const summary = document.createElement('summary');
  summary.textContent = 'Diagnostics';
  details.appendChild(summary);

  const fields = [
    ['Phase', fleet.last_error_phase],
    ['Model', fleet.last_error_model],
    ['Retries', fleet.last_error_retries],
    ['When', present(fleet.last_error_ts)
      ? `${ago(fleet.last_error_ts)} (${isoLocal(fleet.last_error_ts)})`
      : null],
    ['Engine', fleet.last_engine],
    ['Wrapper', present(fleet.wrapper_duration_sec) ? `${fleet.wrapper_duration_sec}s` : null],
    ['Detail', fleet.last_error_detail],
  ];
  for (const [label, value] of fields) {
    if (!present(value)) continue;
    const row = document.createElement('div');
    row.className = 'row';
    const lbl = document.createElement('span');
    lbl.className = 'label';
    lbl.textContent = label;
    const val = document.createElement('span');
    val.className = 'value';
    val.textContent = String(value);
    row.appendChild(lbl);
    row.appendChild(val);
    details.appendChild(row);
  }

  if (present(fleet.last_error_message)) {
    const lbl = document.createElement('div');
    lbl.className = 'field-label';
    lbl.textContent = 'Message';
    details.appendChild(lbl);
    const pre = document.createElement('pre');
    pre.textContent = String(fleet.last_error_message);
    details.appendChild(pre);
  }

  return details;
}

// === Expected-fleet panel (Proposal D) ===
//
// Reads fleet-membership.json (written by scripts/membership-check.mjs from
// GitHub Actions). Renders one row per expected machine with a status badge.
// Hidden entirely when no membership data is in the gist (graceful during
// the rollout window before D's first Actions cron tick).
function renderExpectedFleet(gist) {
  const container = document.getElementById('expectedFleet');
  container.innerHTML = '';

  const data = parseFile(gist, 'fleet-membership.json');
  const verdict = data?.verdict;
  if (!verdict || (
      (verdict.active?.length ?? 0) === 0 &&
      (verdict.stale?.length ?? 0) === 0 &&
      (verdict.missing?.length ?? 0) === 0)) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const counts = {
    active: verdict.active?.length ?? 0,
    stale: verdict.stale?.length ?? 0,
    missing: verdict.missing?.length ?? 0,
  };
  const header = document.createElement('div');
  header.className = 'ef-header';
  header.textContent = `EXPECTED FLEET (${counts.active} active, ${counts.stale} stale, ${counts.missing} missing)`;
  container.appendChild(header);

  // Stable display order: active > stale > missing.
  const ordered = [
    ...(verdict.active ?? []),
    ...(verdict.stale ?? []),
    ...(verdict.missing ?? []),
  ];

  for (const m of ordered) {
    const row = document.createElement('div');
    row.className = 'ef-row';

    const left = document.createElement('span');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'ef-name';
    nameSpan.textContent = m.name || m.node_id || '(unknown)';
    left.appendChild(nameSpan);

    const right = document.createElement('span');
    const detail = document.createElement('span');
    detail.className = 'ef-detail';
    if (m.status === 'active' || m.status === 'stale') {
      const ageH = present(m.age_hours) ? `${Number(m.age_hours).toFixed(1)}h` : '?';
      detail.textContent = `last run ${ageH} ago`;
    } else if (m.status === 'missing') {
      detail.textContent = 'no fleet file';
    } else if (m.status === 'corrupt') {
      detail.textContent = 'fleet file unparseable';
    } else if (m.status === 'no-runs') {
      detail.textContent = 'no last_run_ts yet';
    }
    right.appendChild(detail);

    const badge = document.createElement('span');
    const badgeClass = m.status === 'active' ? 'active'
      : m.status === 'stale' ? 'stale'
      : 'missing';
    badge.className = `ef-badge ${badgeClass}`;
    badge.textContent = m.status + (m.monitor_only ? '*' : '');
    right.appendChild(badge);

    row.appendChild(left);
    row.appendChild(right);
    container.appendChild(row);
  }
}

// === Auto-digest panel ===
//
// Reads `auto-digest-<machine>.json` files written each dispatch run
// (Phase -1.5). Aggregation mirrors aggregateFleetAutoDigest in
// scripts/lib/auto-digest.mjs — kept in sync by hand because the dashboard
// has no bundler. Hidden when no snapshots present (graceful rollout).
function renderAutoDigest(gist) {
  const container = document.getElementById('autoDigestPanel');
  container.innerHTML = '';

  const files = Object.keys(gist.files || {}).filter(
    (f) => /^auto-digest-[a-z0-9-]+\.json$/.test(f)
  );
  const snaps = [];
  for (const f of files) {
    const data = parseFile(gist, f);
    if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) continue;
    snaps.push(data);
  }
  if (snaps.length === 0) {
    container.style.display = 'none';
    return;
  }

  // Aggregate per-machine + per-project, mirroring aggregateFleetAutoDigest.
  const byMachine = [];
  const projectMap = new Map();
  let totalCommits = 0;
  const projectSlugs = new Set();

  for (const snap of snaps) {
    let machineCommits = 0;
    const projectsDetail = [];
    for (const p of snap.projects || []) {
      const total = Number(p.total) || 0;
      projectsDetail.push({ slug: p.project_slug, total });
      machineCommits += total;
      if (total > 0) {
        projectSlugs.add(p.project_slug);
        const existing = projectMap.get(p.project_slug) || {
          slug: p.project_slug, commits: 0, machines: [],
        };
        existing.commits += total;
        existing.machines.push({ machine: snap.machine, count: total });
        projectMap.set(p.project_slug, existing);
      }
    }
    totalCommits += machineCommits;
    byMachine.push({
      machine: snap.machine,
      computed_at: snap.computed_at,
      commits: machineCommits,
      projects_detail: projectsDetail,
    });
  }
  byMachine.sort((a, b) => String(a.machine).localeCompare(String(b.machine)));
  const byProject = Array.from(projectMap.values()).sort(
    (a, b) => b.commits - a.commits || a.slug.localeCompare(b.slug)
  );

  const details = document.createElement('details');
  details.className = 'panel-details';

  const summary = document.createElement('summary');
  summary.className = 'panel-summary ad-header';
  summary.textContent = `Auto-digest - ${totalCommits} commits / ${projectSlugs.size} projects (24h)`;
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'panel-body';

  // Per-machine rows
  const machineSection = document.createElement('div');
  machineSection.className = 'ad-section';
  machineSection.textContent = 'By machine';
  body.appendChild(machineSection);

  for (const m of byMachine) {
    const row = document.createElement('div');
    row.className = 'ad-row';
    const left = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'ad-name';
    name.textContent = m.machine;
    left.appendChild(name);

    const top3 = (m.projects_detail || [])
      .filter((p) => p.total > 0)
      .sort((a, b) => b.total - a.total)
      .slice(0, 3)
      .map((p) => `${p.slug}:${p.total}`)
      .join(', ');
    if (top3) {
      const detail = document.createElement('span');
      detail.className = 'ad-detail';
      detail.textContent = '  ' + top3;
      left.appendChild(detail);
    }

    const right = document.createElement('span');
    const count = document.createElement('span');
    count.className = `ad-count${m.commits === 0 ? ' zero' : ''}`;
    count.textContent = `${m.commits} commit${m.commits === 1 ? '' : 's'}`;
    right.appendChild(count);

    row.appendChild(left);
    row.appendChild(right);
    body.appendChild(row);
  }

  // Per-project rollup (only projects with commits)
  if (byProject.length > 0) {
    const projSection = document.createElement('div');
    projSection.className = 'ad-section';
    projSection.textContent = 'By project';
    body.appendChild(projSection);

    for (const p of byProject) {
      const row = document.createElement('div');
      row.className = 'ad-row';
      const left = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'ad-name';
      name.textContent = p.slug;
      left.appendChild(name);
      const detail = document.createElement('span');
      detail.className = 'ad-detail';
      detail.textContent = '  ' + p.machines
        .map((mm) => `${mm.machine}:${mm.count}`)
        .join(', ');
      left.appendChild(detail);

      const right = document.createElement('span');
      const count = document.createElement('span');
      count.className = 'ad-count';
      count.textContent = `${p.commits} commit${p.commits === 1 ? '' : 's'}`;
      right.appendChild(count);

      row.appendChild(left);
      row.appendChild(right);
      body.appendChild(row);
    }
  }

  details.appendChild(body);
  container.appendChild(details);
  container.style.display = '';
}

// === Control Room trust-signal sub-panels ===
// Render the 5-C gates/quality/merge telemetry that rides inside each
// fleet-<host>.json control_room digest. Each helper is additive: it
// appends nothing when its data is missing or empty.

function renderCRReverts(withCR, container) {
  const all = [];
  for (const s of withCR) {
    const list = Array.isArray(s.control_room.reverts) ? s.control_room.reverts : [];
    for (const r of list) all.push(r);
  }
  const seen = new Set();
  const rows = [];
  for (const r of all) {
    const key = String(r.slug ?? '') + '|' + String(r.ts ?? '') + '|' + String(r.reason ?? '');
    if (seen.has(key)) continue;
    seen.add(key);
    rows.push(r);
  }
  rows.sort((a, b) => String(b.ts ?? '').localeCompare(String(a.ts ?? '')));
  const capped = rows.slice(0, 8);
  if (capped.length === 0) return;

  const head = document.createElement('div');
  head.className = 'cr-subhead';
  head.textContent = 'GATES FIRED -- ' + capped.length + ' recent revert' + (capped.length === 1 ? '' : 's');
  container.appendChild(head);

  const wrap = document.createElement('div');
  wrap.className = 'cr-feed';
  for (const r of capped) {
    const row = document.createElement('div');
    const kind = r.kind === 'auto' ? 'auto' : 'manual';
    row.className = 'cr-feed-row ' + (kind === 'auto' ? 'ok' : 'warn');

    const t = document.createElement('span');
    t.className = 'cr-feed-time';
    const ms = Date.parse(r.ts);
    t.textContent = isFinite(ms) ? formatDuration(Date.now() - ms) : '';
    row.appendChild(t);

    const badge = document.createElement('span');
    badge.className = 'cr-revert-kind ' + kind;
    badge.textContent = kind === 'auto' ? 'AUTO' : 'MANUAL';
    row.appendChild(badge);

    const slug = document.createElement('span');
    slug.className = 'cr-timeline-slug';
    slug.textContent = r.slug ?? '?';
    row.appendChild(slug);

    const reason = document.createElement('span');
    reason.className = 'cr-feed-line';
    reason.textContent = r.reason ?? '(no reason)';
    row.appendChild(reason);

    wrap.appendChild(row);
  }
  container.appendChild(wrap);
}

function renderCRQuality(withCR, container) {
  const map = new Map();
  for (const s of withCR) {
    const q = s.control_room.quality;
    if (!q || typeof q !== 'object') continue;
    for (const slug of Object.keys(q)) {
      const entry = q[slug];
      if (!entry || typeof entry !== 'object') continue;
      let acc = map.get(slug);
      if (!acc) {
        acc = { latest: entry.latest, trend: entry.trend, hasHighOrCritical: !!entry.hasHighOrCritical };
        map.set(slug, acc);
        continue;
      }
      const aLatest = entry.latest != null && Number.isFinite(Number(entry.latest)) ? Number(entry.latest) : null;
      const bLatest = acc.latest != null && Number.isFinite(Number(acc.latest)) ? Number(acc.latest) : null;
      if (aLatest !== null && (bLatest === null || aLatest > bLatest)) {
        acc.latest = entry.latest;
        acc.trend = entry.trend;
      }
      acc.hasHighOrCritical = !!(acc.hasHighOrCritical || entry.hasHighOrCritical);
    }
  }
  if (map.size === 0) return;

  const head = document.createElement('div');
  head.className = 'cr-subhead';
  head.textContent = 'CODE QUALITY -- audit findings per project';
  container.appendChild(head);

  const slugs = Array.from(map.keys()).sort();
  for (const slug of slugs) {
    const q = map.get(slug);
    const row = document.createElement('div');
    row.className = 'cr-trust-row';

    const sl = document.createElement('span');
    sl.className = 'cr-timeline-slug';
    sl.textContent = slug;
    row.appendChild(sl);

    const findings = document.createElement('span');
    findings.textContent = 'findings: ' + (q.latest != null && Number.isFinite(Number(q.latest)) ? String(q.latest) : '-');
    row.appendChild(findings);

    const trendClass = q.trend === 'up' ? 'up' : q.trend === 'down' ? 'down' : 'flat';
    const trendText = q.trend === 'up' ? 'up' : q.trend === 'down' ? 'dn' : 'flat';
    const trend = document.createElement('span');
    trend.className = 'cr-quality-trend ' + trendClass;
    trend.textContent = trendText;
    row.appendChild(trend);

    if (q.hasHighOrCritical) {
      const flag = document.createElement('span');
      flag.className = 'cr-quality-flag';
      flag.textContent = 'HIGH/CRIT';
      row.appendChild(flag);
    }

    container.appendChild(row);
  }
}

function renderCRMergeStats(withCR, container) {
  const map = new Map();
  for (const s of withCR) {
    const ms = s.control_room.mergeStats;
    if (!ms || typeof ms !== 'object') continue;
    for (const slug of Object.keys(ms)) {
      const entry = ms[slug];
      if (!entry || typeof entry !== 'object') continue;
      const existing = map.get(slug);
      if (!existing || Number(entry.total) > Number(existing.total)) {
        map.set(slug, entry);
      }
    }
  }
  if (map.size === 0) return;

  const head = document.createElement('div');
  head.className = 'cr-subhead';
  head.textContent = 'MERGE THROUGHPUT -- merged rate and median latency';
  container.appendChild(head);

  const slugs = Array.from(map.keys()).sort();
  for (const slug of slugs) {
    const m = map.get(slug);
    const row = document.createElement('div');
    row.className = 'cr-trust-row';

    const sl = document.createElement('span');
    sl.className = 'cr-timeline-slug';
    sl.textContent = slug;
    row.appendChild(sl);

    const merged = Number(m.merged) || 0;
    const total = Number(m.total) || 0;
    const rate = Number.isFinite(Number(m.rate)) ? Number(m.rate) : (total > 0 ? merged / total : 0);
    const pct = Math.round(rate * 100);
    const text = document.createElement('span');
    text.textContent = merged + '/' + total + ' merged (' + pct + '%)';
    row.appendChild(text);

    if (m.medianLatencyMs != null && Number.isFinite(Number(m.medianLatencyMs))) {
      const med = Number(m.medianLatencyMs);
      const medSpan = document.createElement('span');
      medSpan.textContent = ' median ' + formatDurationShort(med);
      row.appendChild(medSpan);
    }

    container.appendChild(row);
  }
}

// Build a grouped, capped annunciator feed. Consecutive rows with the same
// (machine, line-text) collapse into one row with an xN suffix. At most 15
// grouped rows are shown; any remainder hide behind a <details> summary.
function buildGroupedFeed(container, items, makeRow) {
  if (!items || items.length === 0) return;
  const groups = [];
  for (const item of items) {
    const machine = item.machine || '';
    const line = item.line || '';
    if (groups.length > 0) {
      const last = groups[groups.length - 1];
      if (last.machine === machine && last.line === line) {
        last.count += 1;
        last.items.push(item);
        continue;
      }
    }
    groups.push({ machine, line, count: 1, items: [item], first: item });
  }
  const visible = groups.slice(0, 15);
  const hidden = groups.slice(15);
  for (const g of visible) {
    container.appendChild(makeRow(g));
  }
  if (hidden.length > 0) {
    const details = document.createElement('details');
    details.className = 'cr-feed-more';
    const summary = document.createElement('summary');
    summary.textContent = `Show all ${items.length} events`;
    details.appendChild(summary);
    const body = document.createElement('div');
    body.className = 'cr-feed-more-body';
    for (const g of hidden) {
      body.appendChild(makeRow(g));
    }
    details.appendChild(body);
    container.appendChild(details);
  }
}

// === Stuck-patterns panel ===
// Reads stuck_patterns from the same auto-digest-<host>.json gist files
// that the auto-digest panel uses. Surfaces (project, task) pairs whose
// last N consecutive worker runs all skipped with the same reason —
// usually a sign the project's opportunistic_tasks list has outgrown its
// source tree. Mirrors aggregateFleetStuckPatterns in
// scripts/lib/auto-digest.mjs (kept in sync by hand since the dashboard
// has no bundler).
function renderControlRoom(fleetSnaps) {
  const container = document.getElementById('controlRoomPanel');
  container.innerHTML = '';

  const withCR = (fleetSnaps || []).filter(
    (s) => s && s.control_room &&
      (Array.isArray(s.control_room.feed) || Array.isArray(s.control_room.cards))
  );

  // Merge feeds across machines (tag each with its friendly machine name).
  const feed = [];
  for (const s of withCR) {
    const name = MACHINE_NAMES[s.machine] || s.machine;
    for (const f of (s.control_room.feed || [])) feed.push({ ...f, machine: name });
  }

  // Aggregate per-project health across machines (worst health wins).
  const RANK = { down: 3, degraded: 2, healthy: 1, idle: 0 };
  const projMap = new Map();
  for (const s of withCR) {
    for (const c of (s.control_room.cards || [])) {
      const cur = projMap.get(c.slug);
      if (!cur || (RANK[c.health] || 0) > (RANK[cur.health] || 0)) {
        projMap.set(c.slug, {
          slug: c.slug, health: c.health,
          relayStage: c.relayStage || null, relayNext: c.relayNext || null,
        });
      } else if (cur && !cur.relayStage && c.relayStage) {
        // Fill a missing stage from another machine that has the baton/derived view.
        cur.relayStage = c.relayStage; cur.relayNext = c.relayNext || null;
      }
    }
  }

  if (feed.length === 0 && projMap.size === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  feed.sort((a, b) => (Date.parse(b.ts) || 0) - (Date.parse(a.ts) || 0));

  const header = document.createElement('div');
  header.className = 'ad-header';
  header.textContent =
    `CONTROL ROOM — live across ${withCR.length} ${withCR.length === 1 ? 'machine' : 'machines'} ` +
    `(STAGE = relay position per SYSTEM-MAP s2; state = last phase/outcome)`;
  container.appendChild(header);

  // COMPOUNDING banner: is the fleet actually LANDING code on build repos? Stops
  // green/liveness from masking a dead compound loop. Build-repo data is
  // laptop-only, so pick the machine that reports build repos (worst status wins).
  let comp = null;
  for (const s of withCR) {
    const c = s.control_room.compounding;
    if (c && Array.isArray(c.buildRepos) && c.buildRepos.length) {
      if (!comp || (COMP_RANK[c.status] || 0) > (COMP_RANK[comp.status] || 0)) comp = c;
    }
  }
  if (comp) {
    const cb = document.createElement('div');
    cb.className = 'cr-compounding ' + (comp.status || 'idle');
    const label = comp.status === 'compounding' ? 'COMPOUNDING'
      : comp.status === 'compounding-manual' ? 'COMPOUNDING (MANUAL)'
      : comp.status === 'stalled' ? 'COMPOUNDING STALLED' : 'COMPOUNDING IDLE';
    const a = comp.authored || {};
    const mergeTxt = comp.daysSinceLastCompoundMerge === null
      ? 'no compound merge in tracked window'
      : 'last compound merge ' + comp.daysSinceLastCompoundMerge + 'd ago';
    const rateTxt = comp.compoundMergeRate === null
      ? 'feature/fix PRs: none tracked'
      : 'feature/fix merge-rate ' + Math.round(comp.compoundMergeRate * 100) + '% ('
        + comp.trackedRefactorMerged + '/' + comp.trackedRefactorTotal + ')';
    const autoTxt = (comp.autonomousMerges || 0) + ' autonomous / ' + (comp.manualMerges || 0) + ' manual merge' + ((comp.manualMerges || 0) === 1 ? '' : 's') + ' ' + comp.windowDays + 'd';
    const badge = document.createElement('span');
    badge.className = 'cr-comp-badge';
    badge.textContent = label;
    // Substantive/infra revert split (2026-07-15). Null-guarded: fleet-*.json
    // snapshots from machines that haven't shipped the split yet lack the fields.
    const revertSplit = ((a.reverted_substantive || 0) + (a.reverted_infra || 0)) > 0
      ? ' (' + (a.reverted_substantive || 0) + ' subst / ' + (a.reverted_infra || 0) + ' infra)'
      : '';
    const detail = document.createElement('span');
    detail.className = 'cr-comp-detail';
    detail.textContent = mergeTxt + ' · ' + rateTxt
      + ' · ' + autoTxt
      + ' · authored ' + comp.windowDays + 'd: ' + (a.success || 0) + ' ok / '
