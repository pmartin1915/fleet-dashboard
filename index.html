  // commit patterns inside a single dispatch can briefly approach 0.5
  // without indicating a stuck rotation.
  const STUCK_THRESHOLD = 0.6;
  const window_ = commits.slice(0, WINDOW_SIZE);
  if (window_.length < 3) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = 'Is rotation working?';
  container.appendChild(header);

  // Count how many times each project shows up in the recent window.
  const counts = new Map();
  for (const c of window_) counts.set(c.slug, (counts.get(c.slug) || 0) + 1);
  const distinct = counts.size;
  const dominant = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const isStuck = dominant && dominant[1] / window_.length > STUCK_THRESHOLD;

  // Sequence (newest → oldest, already sorted by aggregator).
  const seq = document.createElement('div');
  seq.className = 'rot-seq';
  seq.appendChild(document.createTextNode(`Last ${window_.length} commits: `));
  for (const c of window_) {
    const slug = document.createElement('span');
    slug.className = 'rot-slug';
    if (isStuck && c.slug === dominant[0]) slug.classList.add('dominant');
    slug.textContent = c.slug;
    seq.appendChild(slug);
  }
  container.appendChild(seq);

  const verdict = document.createElement('div');
  if (isStuck) {
    verdict.className = 'rot-verdict stuck';
    verdict.appendChild(makeStatusDot('broken'));
    verdict.appendChild(document.createTextNode(
      ` Stuck — ${dominant[0]} ran ${dominant[1]} of ${window_.length} times. Selector backoff or a project failing every cycle.`
    ));
  } else {
    verdict.className = 'rot-verdict ok';
    verdict.appendChild(makeStatusDot('running'));
    verdict.appendChild(document.createTextNode(
      ` Rotating — ${distinct} distinct ${distinct === 1 ? 'project' : 'projects'} in the last ${window_.length} commits.`
    ));
  }
  container.appendChild(verdict);
}

// "Things needing your attention" — hides when empty. Sources: stale-from-
// membership, consecutive_errors >= 3 per machine. Pending-merges age and
// canary-failure rules are deferred to a future pass — the data shapes for
// "open since" and "canary failed last cycle" need extra work that doesn't
// belong in v1.
function renderAttention(gist, fleetSnaps) {
  const container = document.getElementById('attentionPanel');
  container.innerHTML = '';

  const entries = [];
  // Track Rule A machines so Rule C can enrich an existing row instead of
  // double-listing the same machine when it has both 3 consecutive errors
  // and a structural-failure-with-candidates.
  const ruleAEntryByMachine = new Map();

  // Rule A: any machine with >= 3 consecutive errors.
  for (const f of fleetSnaps || []) {
    const errs = Number(f?.consecutive_errors) || 0;
    if (errs < 3) continue;
    const friendly = MACHINE_NAMES[f.machine] || f.machine || '(unknown)';
    const phase = phaseToStage(f.last_error_phase);
    const headline = `${friendly} has errored ${errs} cycles in a row.`;
    let detail;
    if (phase) {
      detail = `Last failure at stage ${phase.num ?? phase.label} (${phase.label}). Open the per-machine card below for the diagnostics drawer.`;
    } else if (present(f.last_error_reason)) {
      detail = `Reason: ${f.last_error_reason}. Diagnostics drawer below has the message.`;
    } else {
      detail = 'Open the per-machine card below for the diagnostics drawer.';
    }
    const entry = { tier: 'err', headline, detail };
    entries.push(entry);
    if (f.machine) ruleAEntryByMachine.set(f.machine, entry);
  }

  // Rule B: stale machines from fleet-membership.json verdict. Both `stale`
  // (>= 4h since last run) and `missing` (no fleet file) are interesting.
  const membership = parseFile(gist, 'fleet-membership.json');
  const verdict = membership?.verdict;
  if (verdict) {
    for (const m of verdict.stale || []) {
      const friendly = MACHINE_NAMES[m.name] || m.name || '(unknown)';
      const ageH = present(m.age_hours)
        ? `${Number(m.age_hours).toFixed(1)}h`
        : 'a while';
      entries.push({
        tier: 'warn',
        headline: `${friendly} hasn't checked in for ${ageH}.`,
        detail: 'Could be: PC asleep, scheduled task disabled, or canary failing. Open the laptop / PC and check the dispatcher service.',
      });
    }
    for (const m of verdict.missing || []) {
      if (m.monitor_only) continue;
      const friendly = MACHINE_NAMES[m.name] || m.name || '(unknown)';
      entries.push({
        tier: 'err',
        headline: `${friendly} has no fleet file at all.`,
        detail: 'Either it has never run, or the gist write is failing. Check GIST_AUTH_TOKEN scope on that machine.',
      });
    }
  }

  // Rule C: per-machine structural-failure context from health-<machine>.json.
  // Mirrors the `Failure ctx: ... candidates=[...]` line from remote-status.mjs
  // (lines 203-214) so the operator can see which models were tried-and-rejected
  // by a project-scoped local.json override without SSHing into the failing PC.
  // Only fires when the machine is degraded/down with a project-scoped failure
  // — for healthy/idle machines this would be noise.
  for (const f of fleetSnaps || []) {
    if (!f?.machine) continue;
    // parseFile() returns {} on missing, never null — plain `.` is sufficient.
    const health = parseFile(gist, `health-${f.machine}.json`);
    const sf = health.last_structural_failure;
    if (!sf || !sf.project) continue;
    if (health.state !== 'degraded' && health.state !== 'down') continue;
    const cands = Array.isArray(sf.candidates) && sf.candidates.length
      ? `candidates=[${sf.candidates.join(',')}]`
      : '';
    const cls = sf.task_class ? ` class=${sf.task_class}` : '';
    // health.mjs doesn't strictly require sf.task alongside sf.project; fall
    // back to '?' so we never render "project/undefined".
    const task = sf.task || '?';
    const ctx = `${sf.reason} on ${sf.project}/${task}${cls}${cands ? ' ' + cands : ''}`;
    const ruleAEntry = ruleAEntryByMachine.get(f.machine);
    if (ruleAEntry) {
      // Enrich the existing Rule A row rather than double-listing the machine.
      ruleAEntry.detail = ruleAEntry.detail
        ? `${ruleAEntry.detail} Failure ctx: ${ctx}.`
        : `Failure ctx: ${ctx}.`;
      continue;
    }
    const friendly = MACHINE_NAMES[f.machine] || f.machine || '(unknown)';
    const tier = health.state === 'down' ? 'err' : 'warn';
    entries.push({
      tier,
      headline: `${friendly} is ${health.state}: ${sf.reason}.`,
      detail: `Failure ctx: ${ctx}.`,
    });
  }

  if (entries.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  const header = document.createElement('div');
  header.className = 'ts-header';
  header.textContent = `Things needing your attention (${entries.length})`;
  container.appendChild(header);

  for (const e of entries) {
    const row = document.createElement('div');
    row.className = 'att-row';
    const headline = document.createElement('div');
    headline.className = `att-headline ${e.tier}`;
    headline.appendChild(makeStatusDot(e.tier === 'err' ? 'broken' : 'waiting'));
    headline.appendChild(document.createTextNode(' ' + e.headline));
    row.appendChild(headline);
    if (e.detail) {
      const det = document.createElement('div');
      det.className = 'att-detail';
      det.textContent = e.detail;
      row.appendChild(det);
    }
    container.appendChild(row);
  }
}

// === Render ===

function refreshMachineNames(gist) {
  // Rebuild MACHINE_NAMES from fleet-membership.json so new machines added to
  // config/shared.json:expected_machines appear without an HTML edit. The
  // membership-check.mjs verdict spreads each expected_machines entry across
  // active/stale/missing arrays — walk all three and union the (node_id, name)
  // pairs. Seed from MACHINE_NAMES_FALLBACK first so the fallback ordering is
  // preserved for known machines and only NEW ones get appended.
  MACHINE_NAMES = { ...MACHINE_NAMES_FALLBACK };
  const verdict = parseFile(gist, 'fleet-membership.json')?.verdict;
  if (!verdict) return;
  for (const arr of [verdict.active, verdict.stale, verdict.missing]) {
    for (const entry of (arr || [])) {
      if (entry?.node_id && entry?.name) MACHINE_NAMES[entry.node_id] = entry.name;
    }
  }
}

function render(gist) {
  // Refresh the machine-name map before anything else renders, so all
  // downstream panels see config/shared.json's roster (via fleet-membership)
  // not just the hardcoded fallback.
  refreshMachineNames(gist);
  // Match per-machine fleet snapshots only — fleet-membership.json starts
  // with the same prefix but is structurally different (it's the membership
  // verdict written by scripts/membership-check.mjs) and used to slip through
  // the loose filter, rendering a phantom card. The new top sections iterate
  // this same list so the regex tightens here, not just at the new call sites.
  const fleetFiles = Object.keys(gist.files || {}).filter(
    (f) => /^fleet-[a-z0-9-]+\.json$/.test(f) && f !== 'fleet-membership.json'
  );
  // Pre-parse fleet snapshots once — used by every top section and the
  // per-machine cards below. Each file is at most a small JSON object; the
  // cost of double-parsing was negligible but the intermediate is also
  // handy for fleet-wide aggregations.
  const fleetSnaps = fleetFiles.map((f) => {
    const snap = parseFile(gist, f);
    snap.__file = f;
    return snap;
  });

  // === Top sections (Step 2 redesign) ===
  // Order is the load-bearing part: banner → what's happening → today's
  // work → rotation → things needing attention. Anything below this comment
  // is the legacy detail-level panel set, kept verbatim per the plan's
  // rollout step 4 (still useful, just no longer top-level).
  renderBannerV2(gist, fleetSnaps);
  renderWhatsHappening(fleetSnaps);
  renderTodaysWork(gist, fleetSnaps);
  renderRotation(gist);
  renderAttention(gist, fleetSnaps);

  // Expected-fleet panel (Proposal D) — kept as detail-level companion to
  // the new attention panel; the attention panel surfaces only stale/missing
  // membership entries that need action, while this panel shows the full
  // active/stale/missing roster.
  renderExpectedFleet(gist);

  // Auto-digest panel — fleet-wide auto/* commit activity (last 24h).
  renderAutoDigest(gist);

  // Stuck-patterns panel — (project, task) pairs the worker has been
  // skipping for N consecutive cycles. Same gist file as auto-digest.
  renderStuckPatterns(gist);

  // Test-counts panel — fleet agreement on dispatcher test pass/fail/skip
  // counts at the current HEAD. Reads test-counts-<host>.json snapshots
  // written by the daily BudgetDispatcher-TestCounts task. Hidden until
  // at least one machine has uploaded a snapshot.
  renderTestCounts(gist);

  // Pending-merges panel
  renderPendingMerges(gist);

  // Per-machine detail cards (Step 3 of the redesign).
  // The "what's happening" mini-table above is the at-a-glance summary;
  // each card here is collapsed by default and expands to the full row set
  // (project / errors / burn bars / quota / nested diagnostics drawer).
  // The audit confirmed two voices is the right outcome — the summary is
  // operator-friendly, the drawer stays terse and operator-flavored.
  const machinesEl = document.getElementById('machines');
  machinesEl.innerHTML = '';

  if (fleetSnaps.length > 0) {
    const machinesHeader = document.createElement('div');
    machinesHeader.className = 'machines-header';
    machinesHeader.textContent = `Per-machine detail (${fleetSnaps.length})`;
    machinesEl.appendChild(machinesHeader);
  }

  for (const fleet of fleetSnaps) {
    const f = fleet.__file;
    const rawName = fleet.machine || f.replace(/^fleet-/, '').replace(/\.json$/, '');
    const name = MACHINE_NAMES[rawName] || rawName;
    const state = machineState(fleet);

    const card = document.createElement('details');
    card.className = 'card machine-collapsed';
    // Default-open broken machines. The whole point of demoting the cards is
    // to keep the 95% case quiet, but the operator's #1 task when a machine
    // breaks is reading the error message — forcing two clicks (expand card,
    // then expand drawer) at the most urgent moment is the wrong trade.
    if (state === 'err') card.open = true;

    // Summary = collapsed click target. Keep it minimal: status dot, friendly
    // name, and a one-word tail mirroring the top-of-page mini-table verdict
    // (broken / waiting / running / asleep / idle). The tail makes the
    // collapsed state self-describing without forcing the operator to
    // expand the card to learn whether anything is wrong.
    const summary = document.createElement('summary');
    const dot = document.createElement('span');
    dot.className = `machine-dot ${state}`;
    summary.appendChild(dot);
    const nameSpan = document.createElement('span');
    nameSpan.className = 'ms-name';
    nameSpan.textContent = name;
    summary.appendChild(nameSpan);
    const tail = document.createElement('span');
    const status = computeMachineStatus(fleet);
    const tailClasses = ['ms-tail'];
    if (status === 'broken') tailClasses.push('err');
    else if (status === 'waiting') tailClasses.push('warn');
    tail.className = tailClasses.join(' ');
    tail.textContent = status;
    summary.appendChild(tail);
    card.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'machine-body';

    let rows = `
      <div class="row"><span class="label">Last run</span><span class="value">${esc(ago(fleet.last_run_ts))}</span></div>
      <div class="row"><span class="label">Outcome</span><span class="value">${outcomeTag(fleet.last_run_outcome)}</span></div>`;

    // Skip-reason chip — when last_run was a skip, surface the operator-facing
    // sentence from reasonToSentence() (the canonical reason → English mapping).
    // Falls back to the raw code if the reason isn't in the table, so newly
    // added codes still render something rather than disappearing silently.
    if (fleet.last_run_outcome === 'skipped' && present(fleet.last_run_reason)) {
      const sentence = reasonToSentence(fleet.last_run_reason, fleet) || fleet.last_run_reason;
      rows += `<div class="row"><span class="label">Skip reason</span><span class="value warn">${esc(sentence)}</span></div>`;
    }

    if (present(fleet.last_project)) {
      rows += `<div class="row"><span class="label">Project</span><span class="value accent">${esc(fleet.last_project)}</span></div>`;
      rows += `<div class="row"><span class="label">Task</span><span class="value">${esc(safe(fleet.last_task))}</span></div>`;
    }

    if (present(fleet.last_dispatch_ts)) {
      rows += `<div class="row"><span class="label">Last success</span><span class="value success">${esc(ago(fleet.last_dispatch_ts))}</span></div>`;
    }

    if (Number(fleet.consecutive_errors) > 0) {
      rows += `<div class="row"><span class="label">Errors</span><span class="value error">${esc(fleet.consecutive_errors)} consecutive</span></div>`;
    }

    if (present(fleet.last_error_reason) && Number(fleet.consecutive_errors) > 0) {
      rows += `<div class="row"><span class="label">Error</span><span class="value error">${esc(fleet.last_error_reason)}</span></div>`;
    }

    // Stale row — explicit text companion to the gray dot, so iPhone glances
    // get the "this machine hasn't checked in" signal without needing color.
    if (state === 'stale' && present(fleet.last_run_ts)) {
      rows += `<div class="row"><span class="label">Stale</span><span class="value warn">no heartbeat in ${esc(ago(fleet.last_run_ts))}</span></div>`;
    }

    // Auto-pull circuit breaker — a silently-frozen PC keeps dispatching on
    // whatever sha it had when the freeze landed. Without this row a 25h-frozen
    // machine looks identical to a healthy one in the HTML view. Mirrors the
    // terminal dashboard format from scripts/remote-status.mjs:189-202.
    if (fleet.auto_pull_frozen === true) {
      const sha = fleet.auto_pull_sha ? String(fleet.auto_pull_sha).slice(0, 7) : '?';
      const fails = Number.isFinite(fleet.auto_pull_post_pull_failures)
        ? `${fleet.auto_pull_post_pull_failures} post-pull failures`
        : 'frozen';
      const dur = fleet.auto_pull_frozen_at ? ` for ${ago(fleet.auto_pull_frozen_at).replace(/ ago$/, '')}` : '';
      rows += `<div class="row"><span class="label">Auto-pull</span><span class="value error">FROZEN at ${esc(sha)}${esc(dur)} (${esc(fails)})</span></div>`;
    }

    body.innerHTML = rows;

    // Daily-quota counter — append after rows, before burn bars. Only when
    // we actually have a count (new field; gracefully absent on old gist
    // files until each machine's wrapper next runs the new fleet.mjs).
    if (present(fleet.dispatches_today)) {
      body.appendChild(buildQuotaRow(Number(fleet.dispatches_today), fleet.dispatches_today_max));
    }

    // Burn bars — weekly first (the floor that gates dispatch), then 30-day
    // (context for whether the weekly-floor is biting because of a tight
    // month or just an exam-prep week). Estimator may be absent; gate
    // gracefully on null.
    if (present(fleet.weekly_pct) && Number.isFinite(Number(fleet.weekly_pct))) {
      body.appendChild(buildBurnBar('Weekly burn', Number(fleet.weekly_pct)));
    }
    if (present(fleet.monthly_pct) && Number.isFinite(Number(fleet.monthly_pct))) {
      body.appendChild(buildBurnBar('30-day burn', Number(fleet.monthly_pct)));
    }
    // Reset countdown — when the weekly gate is blocking and we know when
    // the window rolls forward, surface the wait. UTC-anchored so the
    // number matches the gate's own clock.
    if (fleet.weekly_gate_passes === false && present(fleet.weekly_hours_until_reset)) {
      const resetRow = document.createElement('div');
      resetRow.className = 'row';
      const lbl = document.createElement('span');
      lbl.className = 'label';
      lbl.textContent = 'Weekly resets in';
      const val = document.createElement('span');
      val.className = 'value warn';
      val.textContent = `${Math.round(Number(fleet.weekly_hours_until_reset))}h`;
      resetRow.appendChild(lbl);
      resetRow.appendChild(val);
      body.appendChild(resetRow);
    }

    // Phase-specific hint (under the Error row), DOM-built for safety
    const hint = errorHint(fleet.last_error_reason, fleet.last_error_detail);
    if (hint && Number(fleet.consecutive_errors) > 0) {
      const hintDiv = document.createElement('div');
      hintDiv.className = 'error-hint';
      hintDiv.textContent = hint;
      body.appendChild(hintDiv);
    }

    // Diagnostics drawer (nested <details> — terse, operator-flavored).
    const drawer = buildDiagDrawer(fleet);
    if (drawer) body.appendChild(drawer);

    card.appendChild(body);
    machinesEl.appendChild(card);
  }
}

// PWA install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').style.display = 'none';
});

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Auto-refresh every 5 minutes
refresh();
setInterval(refresh, 300000);
</script>
